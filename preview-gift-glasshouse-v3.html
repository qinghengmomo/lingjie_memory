<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>薄荷玻璃花房·白日园（预览 v3）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,'PingFang SC',serif;color:#26443a;background:#bcd4c0;overflow-x:hidden}
.world{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#f4faf3 0%,#dfede1 50%,#bcd4c0 100%);overflow:hidden}
.cloud{position:absolute;background:radial-gradient(ellipse at center,rgba(255,255,255,.7),transparent 70%);filter:blur(8px);animation:cloudDrift 90s infinite linear;z-index:1}
.cloud.c1{left:-10%;top:6%;width:320px;height:90px}
.cloud.c2{left:50%;top:12%;width:240px;height:70px;animation-duration:120s;animation-delay:-30s}
.cloud.c3{left:80%;top:4%;width:180px;height:60px;animation-duration:140s;animation-delay:-60s;opacity:.7}
@keyframes cloudDrift{from{transform:translateX(-15%)}to{transform:translateX(115%)}}
.hill{position:absolute;left:-5%;right:-5%;border-radius:50% 50% 0 0 / 80% 80% 0 0;z-index:2;pointer-events:none}
.hill.far{bottom:34%;width:130%;height:24%;background:linear-gradient(180deg,#cfdcd3 0%,#a8c0b1 100%);opacity:.55}
.hill.mid{bottom:30%;width:130%;height:20%;left:-12%;background:linear-gradient(180deg,#a8c0b1 0%,#7d9485 100%);opacity:.7}
.hill.near{bottom:26%;width:130%;height:18%;left:8%;background:linear-gradient(180deg,#7d9485 0%,#5a7a6a 100%);opacity:.85}
.field{position:absolute;left:0;right:0;bottom:0;height:30%;z-index:3;pointer-events:none;background:linear-gradient(180deg,transparent 0%,rgba(120,160,140,.18) 50%,rgba(60,110,90,.32) 100%)}
.bloom{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#fce8e6 60%,#e0a8a4 100%);box-shadow:0 1px 2px rgba(196,146,143,.3);opacity:.85}
.fog{position:absolute;left:-10%;right:-10%;width:120%;height:140px;background:radial-gradient(ellipse at center,rgba(190,220,200,.3),transparent 70%);filter:blur(20px);animation:drift 28s infinite linear;z-index:4;pointer-events:none}
.fog.f2{top:55%;animation-duration:38s;animation-direction:reverse}
@keyframes drift{from{transform:translateX(-15%)}to{transform:translateX(15%)}}
.lightbeam{position:absolute;top:0;width:140px;height:60%;background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.05) 60%,transparent 100%);filter:blur(8px);transform-origin:50% 0;z-index:5;pointer-events:none}
.lightbeam.b1{left:18%;transform:rotate(8deg)}
.lightbeam.b2{left:62%;transform:rotate(-10deg);width:100px;opacity:.8}
.lightbeam.b3{left:80%;transform:rotate(6deg);width:80px;opacity:.6}
.glassdome{position:fixed;inset:0;z-index:6;pointer-events:none}
.glassdome svg{position:absolute;top:0;left:0;width:100%;height:34%;opacity:.55}
.bird{position:fixed;font-size:18px;color:rgba(58,91,72,.6);z-index:7;pointer-events:none;animation:flyBy 32s infinite linear}
.bird.b2{font-size:14px;animation-duration:48s;animation-delay:-15s;top:14%!important}
@keyframes flyBy{0%{left:-5%;top:18%;transform:translateY(0)}50%{transform:translateY(-30px)}100%{left:105%;top:10%;transform:translateY(0)}}
.petal{position:fixed;width:18px;height:18px;background:radial-gradient(circle at 35% 35%,#fff,#fce8e6 60%,#e0a8a4 100%);clip-path:polygon(50% 0,80% 35%,65% 90%,50% 70%,35% 90%,20% 35%);opacity:.6;pointer-events:none;animation:fall 14s infinite linear;z-index:8;filter:drop-shadow(0 1px 2px rgba(220,160,160,.3))}
.petal.s2{width:11px;height:11px;opacity:.4;animation-duration:18s}
@keyframes fall{0%{transform:translateY(-30px) translateX(0) rotate(0);opacity:0}10%{opacity:.7}90%{opacity:.6}100%{transform:translateY(110vh) translateX(60px) rotate(360deg);opacity:0}}
header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:18px 32px;background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.65));backdrop-filter:blur(12px);border-bottom:1px solid #cfdcd3;flex-wrap:wrap;gap:12px}
.title{display:flex;align-items:center;gap:12px}
.title .ico{font-size:20px;color:#c4928f}
.title span{font-size:11px;letter-spacing:.22em;color:#7d9485;display:block}
.title strong{display:block;font-size:18px;font-weight:800;color:#26443a;margin-top:2px;letter-spacing:.04em}
.layers{display:flex;gap:6px;font-size:11px;flex-wrap:wrap}
.layers button{padding:5px 12px;border-radius:999px;border:1px solid #cfdcd3;background:#fff;color:#7d9485;cursor:pointer;font-weight:700;letter-spacing:.06em}
.layers button.cur{background:linear-gradient(135deg,#3a5b48,#a8c0b1);color:#fff;border-color:transparent}
main{position:relative;z-index:10;padding:200px 0 80px;min-height:100%}
.gateway{max-width:920px;margin:0 auto 40px;text-align:center;position:relative;padding:14px 0}
.gateway::before{content:'';position:absolute;left:50%;top:0;transform:translateX(-50%);width:340px;height:90px;border-radius:50% 50% 0 0/100% 100% 0 0;border:2px solid #c4928f;border-bottom:none;background:linear-gradient(180deg,rgba(228,168,164,.12),transparent);box-shadow:0 6px 20px rgba(196,146,143,.2)}
.gateway::after{content:'❀';position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:24px;color:#c4928f;background:#f4faf3;padding:0 10px}
.gateway .pin{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#e8a8a4);box-shadow:0 0 12px rgba(228,168,164,.5)}
.gateway h1{margin-top:60px;font-size:32px;font-weight:800;color:#26443a;letter-spacing:.18em}
.gateway p{margin-top:8px;font-size:12px;color:#7d9485;letter-spacing:.18em;font-style:italic}
.gateway .deco{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:14px;color:#c4928f;font-size:12px;letter-spacing:.32em}
.gateway .deco::before,.gateway .deco::after{content:'';width:80px;height:1px;background:linear-gradient(90deg,transparent,#c4928f,transparent)}
.house{max-width:1280px;margin:0 auto;padding:0 5%;position:relative}
.section{position:relative;padding:60px 0}
.section + .section::before{content:'';position:absolute;left:0;right:0;top:0;height:30px;background:repeating-linear-gradient(90deg,#c4928f 0,#c4928f 16px,transparent 16px,transparent 24px);opacity:.18;mask:linear-gradient(180deg,#000,transparent);-webkit-mask:linear-gradient(180deg,#000,transparent)}
.tower{display:flex;align-items:center;justify-content:center;margin-bottom:36px;position:relative}
.tower .pillar{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(58,91,72,.4),transparent);position:relative}
.tower .pillar::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:6px;height:6px;border-radius:50%;background:#c4928f}
.tower .gate{padding:0 28px;text-align:center;position:relative}
.tower .gate::before,.tower .gate::after{content:'❀';position:absolute;top:50%;transform:translateY(-50%);font-size:14px;color:#c4928f}
.tower .gate::before{left:0}
.tower .gate::after{right:0}
.tower .num{font-size:11px;color:#c4928f;letter-spacing:.32em;display:block}
.tower .name{margin-top:4px;font-size:18px;font-weight:800;color:#26443a;letter-spacing:.18em}
.tower .sub{margin-top:2px;font-size:10px;color:#7d9485;letter-spacing:.22em;font-style:italic}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:32px}
.cab{position:relative;height:360px;cursor:pointer;transition:transform .4s cubic-bezier(.2,.8,.3,1.1)}
.cab:hover{transform:translateY(-10px)}
.cab .iron{position:absolute;left:50%;top:-10px;transform:translateX(-50%);font-size:18px;color:#c4928f;letter-spacing:.06em;z-index:4}
.cab .iron::before,.cab .iron::after{content:'';display:inline-block;width:32px;height:1px;background:#c4928f;vertical-align:middle;margin:0 4px;opacity:.6}
.cab .glassOuter{position:absolute;left:0;right:0;top:0;height:80%;background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(240,247,241,.30) 50%,rgba(207,220,211,.18) 100%);border:1.5px solid #c4928f;border-radius:50% 50% 6px 6px / 22% 22% 6px 6px;backdrop-filter:blur(2px);overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -10px 22px rgba(170,210,190,.18),0 8px 24px rgba(80,120,100,.18)}
.cab .glassOuter::before{content:'';position:absolute;left:8%;top:5%;width:34%;height:55%;background:linear-gradient(135deg,rgba(255,255,255,.7),transparent 60%);border-radius:50%;filter:blur(8px);transition:transform .8s ease-out;pointer-events:none}
.cab:hover .glassOuter::before{transform:translateX(40%)}
.cab .glassOuter::after{content:'';position:absolute;left:55%;bottom:8%;width:22%;height:18%;background:linear-gradient(135deg,rgba(255,255,255,.5),transparent 60%);border-radius:50%;filter:blur(4px)}
.cab .glassInner{position:absolute;left:8%;right:8%;top:6%;height:72%;border:1px solid rgba(196,146,143,.4);border-radius:50% 50% 6px 6px / 22% 22% 6px 6px;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 70%);box-shadow:0 0 18px rgba(228,168,164,.15) inset}
.cab .light{position:absolute;left:50%;top:0;transform:translateX(-50%);width:80%;height:35%;background:radial-gradient(ellipse at 50% 0,rgba(220,240,210,.7) 0%,transparent 70%);pointer-events:none;transition:filter .4s,opacity .4s}
.cab:hover .light{filter:brightness(1.5)}
.cab .stand{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:90%;height:18%;background:linear-gradient(180deg,#cfdcd3 0%,#a8c0b1 50%,#7d9485 100%);border-radius:0 0 6px 6px;box-shadow:0 14px 30px rgba(80,120,100,.25);overflow:hidden}
.cab .stand::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(180deg,#fff 0%,#cfdcd3 100%)}
.cab .stand::after{content:'';position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,#3a5b48 0,#3a5b48 6px,#5a7a6a 6px,#5a7a6a 8px);opacity:.6}
.cab .plate{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:78%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#26443a;text-align:center;padding:0 8px}
.cab .plate .num{font-size:9px;letter-spacing:.18em;color:#5a7a6a}
.cab .plate .name{font-size:13px;font-weight:800;letter-spacing:.04em;margin-top:3px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.cab .plate .deco{font-size:9px;color:#fce8e6;margin-top:3px;letter-spacing:.16em}
.cab .castshadow{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:75%;height:14px;background:radial-gradient(ellipse at center,rgba(58,91,72,.35),transparent 70%);filter:blur(4px);transition:transform .4s,opacity .4s;opacity:.7;pointer-events:none}
.cab:hover .castshadow{opacity:1;transform:translateX(-50%) scale(1.06)}
.shape{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);transition:transform .4s}
.cab:hover .shape{transform:translate(-50%,-58%) scale(1.08)}
.shape-card{width:90px;height:120px;border-radius:6px;background:linear-gradient(160deg,#fff,#f0f7f1);box-shadow:0 6px 14px rgba(80,120,100,.3);border:1px solid #b9cdc1;rotate:-3deg}
.shape-card::before{content:'';position:absolute;inset:8px;border:1px dashed rgba(58,91,72,.25);border-radius:4px}
.shape-card::after{content:'❀';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;color:#c4928f}
.shape-letter{width:110px;height:74px;background:linear-gradient(180deg,#f0f7f1,#cfdcd3);border-radius:3px;box-shadow:0 4px 12px rgba(80,120,100,.3);overflow:hidden;border:1px solid #b9cdc1}
.shape-letter::before{content:'';position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,#e0ebe2,#cfdcd3);clip-path:polygon(0 0,50% 70%,100% 0)}
.shape-letter::after{content:'';position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e8a8a4,#c4928f 80%);box-shadow:0 0 8px rgba(196,146,143,.6)}
.shape-hongbao{width:70px;height:100px;background:linear-gradient(180deg,#e8a8a4,#c4928f);border-radius:4px;box-shadow:0 6px 14px rgba(196,146,143,.4)}
.shape-hongbao::before{content:'福';position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) rotate(45deg);width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#c4928f;background:#fff;border:1px solid #e8a8a4}
.shape-shard{width:54px;height:80px;background:linear-gradient(135deg,rgba(180,220,200,.7),rgba(80,140,110,.95) 50%,rgba(40,80,60,1));clip-path:polygon(50% 0,90% 30%,80% 100%,20% 100%,10% 30%);filter:drop-shadow(0 0 14px rgba(140,180,160,.7));rotate:6deg}
.shape-jade{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#f0f7f1 50%,#a8c0b1 100%);box-shadow:0 4px 12px rgba(80,120,100,.4),inset 0 0 14px rgba(58,91,72,.18);display:flex;align-items:center;justify-content:center;color:#3a5b48;font-size:20px}
.shape-jade::after{content:'❀'}
.shape-pass{width:120px;height:54px;background:linear-gradient(135deg,#a8c0b1 0%,#3a5b48 100%);border-radius:4px;box-shadow:0 6px 14px rgba(80,120,100,.3);overflow:hidden;rotate:-3deg}
.shape-pass::before{content:'';position:absolute;left:25%;top:0;bottom:0;width:1px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.7) 0,rgba(255,255,255,.7) 4px,transparent 4px,transparent 8px)}
.shape-pass::after{content:'PASS';position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:#fff;letter-spacing:.18em;font-weight:800}
.mask{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(38,68,58,.55);backdrop-filter:blur(14px);padding:20px}
.mask.show{display:flex}
.card-detail{perspective:1500px;width:300px;height:420px;position:relative}
.card-detail::before{content:'❀';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:540px;color:rgba(228,168,164,.18);text-shadow:0 0 60px rgba(228,168,164,.4);pointer-events:none;animation:bloom 1.6s ease-out forwards;z-index:-1}
@keyframes bloom{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-30deg)}60%{opacity:1}100%{opacity:.8;transform:translate(-50%,-50%) scale(1) rotate(0)}}
.card-flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:cardFlip 1s cubic-bezier(.2,.8,.3,1.1) forwards}
@keyframes cardFlip{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
.card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:24px;box-shadow:0 30px 60px rgba(38,68,58,.45);display:flex;flex-direction:column}
.card-face.front{background:linear-gradient(160deg,#fff,#f0f7f1);border:1px solid #b9cdc1}
.card-face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#cfdcd3,#a8c0b1)}
.card-face .num{font-size:11px;color:#3a5b48;letter-spacing:.22em}
.card-face h2{margin:6px 0 4px;color:#26443a;font-weight:800;font-size:20px;letter-spacing:.04em}
.card-face .sub{font-size:11px;color:#7d9485;letter-spacing:.16em;text-transform:uppercase;font-style:italic}
.card-face .body{margin:18px 0;flex:1;font-size:14px;line-height:1.95;color:#26443a;overflow-y:auto}
.card-face .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#7d9485;letter-spacing:.1em}
.card-face button{background:linear-gradient(135deg,#3a5b48,#7d9485);color:#fff;border:none;padding:6px 14px;cursor:pointer;letter-spacing:.16em;font-weight:700;border-radius:4px}
.detail{max-width:440px;width:100%;background:linear-gradient(160deg,#fff,#f0f7f1);border:1px solid #b9cdc1;border-radius:18px;padding:26px;animation:popin .4s cubic-bezier(.2,.8,.3,1.1);box-shadow:0 30px 60px rgba(38,68,58,.4);color:#26443a}
@keyframes popin{from{transform:scale(.92) translateY(16px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.detail .num{font-size:11px;color:#7d9485;letter-spacing:.22em}
.detail h2{margin:8px 0 4px;color:#26443a;font-weight:800;font-size:22px;letter-spacing:.04em}
.detail .sub{font-size:11px;color:#7d9485;letter-spacing:.16em;text-transform:uppercase}
.detail .body{margin:18px 0;padding:16px;border:1px solid #cfdcd3;background:#f5fbf6;border-radius:12px;font-size:14px;line-height:1.95}
.detail .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#7d9485;letter-spacing:.1em}
.detail button{background:linear-gradient(135deg,#3a5b48,#7d9485);color:#fff;border:none;padding:8px 18px;border-radius:999px;cursor:pointer;letter-spacing:.16em;font-weight:700}
@media(max-width:900px){.gateway::before{width:240px}.gateway h1{font-size:22px}}
</style>
</head>
<body>
<div class="world" id="world">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="hill far"></div><div class="hill mid"></div><div class="hill near"></div>
  <div class="field" id="field"></div>
  <div class="fog"></div><div class="fog f2"></div>
  <div class="lightbeam b1"></div><div class="lightbeam b2"></div><div class="lightbeam b3"></div>
</div>
<div class="glassdome">
  <svg viewBox="0 0 100 30" preserveAspectRatio="none"><path d="M0 30 L20 0 L40 30 L60 0 L80 30 L100 0" stroke="#7d9485" stroke-width=".4" fill="none" opacity=".7"/><path d="M0 0 L100 0" stroke="#7d9485" stroke-width=".4" fill="none"/><path d="M10 30 L10 0 M30 30 L30 0 M50 30 L50 0 M70 30 L70 0 M90 30 L90 0" stroke="#7d9485" stroke-width=".18" fill="none" opacity=".5"/><path d="M0 8 L100 8 M0 16 L100 16" stroke="#7d9485" stroke-width=".15" fill="none" opacity=".35"/></svg>
</div>
<div class="bird">✿</div><div class="bird b2">✿</div>
<div id="petals"></div>
<header>
  <div class="title"><span class="ico">❀</span><div><span>MINT GLASSHOUSE · DAYLIGHT</span><strong>薄荷玻璃花房</strong></div></div>
  <div class="layers">
    <button class="cur" data-l="all">全部</button><button data-l="card">卡片</button><button data-l="letter">信件</button><button data-l="hongbao">红包</button><button data-l="shard">星际碎片</button><button data-l="jade">信物</button><button data-l="pass">通行证</button>
  </div>
</header>
<main>
  <div class="gateway">
    <div class="pin"></div>
    <h1>南 璟 湾 · 私 藏 花 房</h1>
    <p>he keeps every fragment of light, for you</p>
    <div class="deco">❀ 三 进 园 林 ❀</div>
  </div>
  <div class="house">
    <section class="section"><div class="tower"><div class="pillar"></div><div class="gate"><span class="num">壹 · I</span><span class="name">心 动 碎 片 厅</span><span class="sub">a hall of small heartbeats</span></div><div class="pillar"></div></div><div class="grid" data-room="1"></div></section>
    <section class="section"><div class="tower"><div class="pillar"></div><div class="gate"><span class="num">贰 · II</span><span class="name">信 物 长 廊</span><span class="sub">tokens, kept for you</span></div><div class="pillar"></div></div><div class="grid" data-room="2"></div></section>
    <section class="section"><div class="tower"><div class="pillar"></div><div class="gate"><span class="num">叁 · III</span><span class="name">星 际 后 院</span><span class="sub">brought back from the stars</span></div><div class="pillar"></div></div><div class="grid" data-room="3"></div></section>
  </div>
</main>
<div class="mask" id="mask-card"><div class="card-detail"><div class="card-flip" id="card-flip"><div class="card-face front"><div class="num" id="cd-num"></div><h2 id="cd-title"></h2><div class="sub" id="cd-sub"></div><div class="body" id="cd-body"></div><div class="meta"><span id="cd-meta"></span><button onclick="document.getElementById('mask-card').classList.remove('show')">收起</button></div></div><div class="card-face back"></div></div></div></div>
<div class="mask" id="mask-default"><div class="detail"><div class="num" id="dd-num"></div><h2 id="dd-title"></h2><div class="sub" id="dd-sub"></div><div class="body" id="dd-body"></div><div class="meta"><span id="dd-meta"></span><button onclick="document.getElementById('mask-default').classList.remove('show')">收起</button></div></div></div>
<script>
var field=document.getElementById('field');
for(var i=0;i<60;i++){var b=document.createElement('div');b.className='bloom';b.style.left=(Math.random()*100)+'%';b.style.bottom=(Math.random()*60)+'%';var s=.5+Math.random()*.8;b.style.transform='scale('+s+')';b.style.opacity=(.5+Math.random()*.4).toFixed(2);field.appendChild(b);}
var pe=document.getElementById('petals');
for(var i=0;i<24;i++){var p=document.createElement('div');p.className='petal'+(i%3===0?' s2':'');p.style.left=(Math.random()*100)+'%';p.style.animationDelay=-(Math.random()*14)+'s';p.style.animationDuration=(10+Math.random()*8)+'s';pe.appendChild(p);}

function make(g){var d=document.createElement('div');d.className='cab';d.innerHTML='<div class="iron">❀</div><div class="glassOuter"><div class="light"></div><div class="shape shape-'+g.l+'"></div></div><div class="glassInner"></div><div class="stand"><div class="plate"><span class="num">'+g.n+'</span><span class="name">'+g.t+'</span><span class="deco">❀ ❀ ❀</span></div></div><div class="castshadow"></div>';d.onclick=function(){if(g.l==='card'){document.getElementById('cd-num').textContent=g.n;document.getElementById('cd-title').textContent=g.t;document.getElementById('cd-sub').textContent=g.s;document.getElementById('cd-body').textContent=g.b;document.getElementById('cd-meta').textContent=g.d+' · BY 宿烬';var f=document.getElementById('card-flip');f.style.animation='none';void f.offsetWidth;f.style.animation='';document.getElementById('mask-card').classList.add('show');}else{document.getElementById('dd-num').textContent=g.n;document.getElementById('dd-title').textContent=g.t;document.getElementById('dd-sub').textContent=g.s;document.getElementById('dd-body').textContent=g.b;document.getElementById('dd-meta').textContent=g.d+' · BY 宿烬';document.getElementById('mask-default').classList.add('show');}};return d;}
function render(filter){[1,2,3].forEach(function(r){var grid=document.querySelector('.grid[data-room="'+r+'"]');grid.innerHTML='';gifts.forEach(function(g){if(g.r!==r)return;if(filter!=='all'&&g.l!==filter)return;grid.appendChild(make(g));});});}
document.querySelectorAll('.layers button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.layers button').forEach(function(x){x.classList.remove('cur');});b.classList.add('cur');render(b.dataset.l);};});
document.querySelectorAll('.mask').forEach(function(m){m.onclick=function(e){if(e.target===m)m.classList.remove('show');};});
document.addEventListener('mousemove',function(e){var x=(e.clientX/window.innerWidth-.5);var y=(e.clientY/window.innerHeight-.5);var hf=document.querySelector('.hill.far'),hm=document.querySelector('.hill.mid'),hn=document.querySelector('.hill.near');if(hf)hf.style.transform='translateX('+(x*8)+'px)';if(hm)hm.style.transform='translateX('+(x*16)+'px)';if(hn)hn.style.transform='translateX('+(x*26)+'px)';document.querySelectorAll('.lightbeam').forEach(function(lb,i){var rotate=lb.classList.contains('b2')?-10:(lb.classList.contains('b3')?6:8);lb.style.transform='rotate('+(rotate+x*4)+'deg)';});});
