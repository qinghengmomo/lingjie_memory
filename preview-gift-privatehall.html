<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>南璟湾·私藏厅（预览）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,'PingFang SC',serif;color:#3a2410;overflow:hidden;background:#0d0805}
.hall{position:fixed;inset:0;perspective:1200px;perspective-origin:50% 40%;background:radial-gradient(ellipse at 50% 35%,#3a2410 0%,#1a0d05 60%,#0d0805 100%);z-index:0}
.backwall{position:absolute;left:0;right:0;top:0;bottom:35%;background:linear-gradient(180deg,#2a1808 0%,#3a2410 50%,#2a1808 100%);border-bottom:1px solid #5a3a18}
.floor{position:absolute;left:-20%;right:-20%;bottom:0;height:50%;background:repeating-linear-gradient(90deg,#2a1808 0,#2a1808 60px,#3a2410 60px,#3a2410 62px),linear-gradient(180deg,#1a0d05 0%,#3a2410 100%);transform:rotateX(60deg);transform-origin:50% 0}
.spotlights{position:absolute;left:0;right:0;top:0;height:65%;pointer-events:none;z-index:1}
.spot{position:absolute;top:0;width:200px;height:100%;background:linear-gradient(180deg,rgba(255,220,160,.2) 0%,rgba(255,220,160,.08) 40%,transparent 80%);filter:blur(10px)}
header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:18px 32px;backdrop-filter:blur(8px);background:rgba(20,12,4,.55);border-bottom:1px solid rgba(220,170,90,.18);flex-wrap:wrap;gap:12px}
.title span{font-size:11px;letter-spacing:.22em;color:#d8a155;display:block}
.title strong{display:block;font-size:18px;font-weight:800;color:#fff5dc;margin-top:2px;letter-spacing:.04em}
.layers{display:flex;gap:6px;font-size:11px;flex-wrap:wrap}
.layers button{padding:5px 12px;border:1px solid rgba(220,170,90,.25);background:transparent;color:#d8a155;cursor:pointer;font-weight:700;letter-spacing:.1em}
.layers button.cur{background:linear-gradient(135deg,#9b1d2b,#d7a85f);color:#fff;border-color:transparent}
.gallery{position:fixed;inset:90px 0 60px;z-index:5;overflow-x:auto;overflow-y:hidden;padding:40px 60px 60px;scroll-behavior:smooth}
.gallery::-webkit-scrollbar{height:6px}
.gallery::-webkit-scrollbar-thumb{background:rgba(220,170,90,.3);border-radius:3px}
.row{display:flex;align-items:flex-end;gap:80px;height:100%;min-width:max-content}
.exhibit{position:relative;flex-shrink:0;width:140px;height:280px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:transform .4s cubic-bezier(.2,.8,.3,1.1)}
.exhibit:hover{transform:translateY(-12px)}
.exhibit::before{content:'';position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:160px;height:280px;background:linear-gradient(180deg,rgba(255,220,160,.25) 0%,rgba(255,220,160,.10) 50%,transparent 100%);filter:blur(14px);pointer-events:none;opacity:.6;transition:opacity .4s;z-index:0}
.exhibit:hover::before{opacity:1}
.exhibit .pedestal{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:130px;height:18px;background:linear-gradient(180deg,#5a3a18 0%,#2a1808 100%);border-radius:2px;box-shadow:0 6px 16px rgba(0,0,0,.6);z-index:2}
.exhibit .pedestal::before{content:'';position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:140px;height:6px;background:linear-gradient(180deg,#7a5a30,#5a3a18);border-radius:3px}
.exhibit .tag{position:absolute;left:50%;bottom:-44px;transform:translateX(-50%);text-align:center;white-space:nowrap;z-index:3}
.exhibit .tag .num{font-size:10px;color:#a08055;letter-spacing:.16em;display:block;margin-bottom:2px}
.exhibit .tag .name{font-size:12px;color:#f4dec0;letter-spacing:.04em}
.shape{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:1;transition:transform .4s,filter .4s}
.shape-card{width:90px;height:130px;border-radius:8px;background:linear-gradient(160deg,#fff7ec,#f4d29c);box-shadow:0 6px 18px rgba(0,0,0,.4);border:1px solid rgba(180,120,40,.4);transform:translateX(-50%) rotate(-2deg)}
.shape-card::before{content:'';position:absolute;inset:8px;border:1px dashed rgba(180,120,40,.3);border-radius:4px}
.shape-card::after{content:'❀';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;color:#9b1d2b}
.exhibit:hover .shape-card{transform:translateX(-50%) rotate(2deg) scale(1.08)}
.shape-letter{width:110px;height:75px;background:linear-gradient(180deg,#f0d9a8,#d8b075);border-radius:3px;box-shadow:0 4px 12px rgba(0,0,0,.4);overflow:hidden;bottom:30px}
.shape-letter::before{content:'';position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,#e8c98a 0%,#d8b075 100%);clip-path:polygon(0 0,50% 70%,100% 0)}
.shape-letter::after{content:'';position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d7a85f,#9b1d2b 80%);box-shadow:0 0 6px rgba(155,29,43,.6);transition:box-shadow .4s}
.exhibit:hover .shape-letter::after{box-shadow:0 0 16px rgba(155,29,43,1)}
.shape-hongbao{width:80px;height:115px;background:linear-gradient(180deg,#c8202e 0%,#9b1d2b 100%);border-radius:4px;box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,200,160,.2);bottom:30px}
.shape-hongbao::before{content:'福';position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) rotate(45deg);width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#9b1d2b;background:#f4d29c;border:1px solid #d7a85f}
.shape-hongbao::after{content:'❀';position:absolute;left:50%;bottom:14%;transform:translateX(-50%);color:#f4d29c;font-size:14px}
@keyframes hongbaoSway{0%,100%{transform:translateX(-50%) rotate(-1deg)}50%{transform:translateX(-50%) rotate(1deg)}}
.exhibit:hover .shape-hongbao{animation:hongbaoSway 1.4s infinite ease-in-out}
.shape-shard{width:60px;height:90px;background:linear-gradient(135deg,rgba(180,140,255,.6) 0%,rgba(120,80,200,.85) 50%,rgba(60,40,120,.95) 100%);clip-path:polygon(50% 0,90% 30%,80% 100%,20% 100%,10% 30%);filter:drop-shadow(0 0 14px rgba(180,140,255,.7));bottom:30px;transform:translateX(-50%) rotate(8deg)}
.exhibit:hover .shape-shard{filter:drop-shadow(0 0 26px rgba(180,140,255,1));transform:translateX(-50%) rotate(-8deg) scale(1.08)}
.shape-jade{width:70px;height:90px;display:flex;align-items:center;justify-content:center;bottom:30px}
.shape-jade::before{content:'';position:absolute;left:50%;top:0;transform:translateX(-50%);width:1px;height:18px;background:#7a5a30}
.shape-jade::after{content:'❀';position:absolute;left:50%;top:65%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#e8e0d0 50%,#c4928f 100%);box-shadow:0 4px 12px rgba(196,146,143,.5),inset 0 0 16px rgba(155,29,43,.3);display:flex;align-items:center;justify-content:center;font-size:20px;color:#9b1d2b;transition:transform .8s}
.exhibit:hover .shape-jade::after{transform:translate(-50%,-50%) rotate(180deg)}
.shape-pass{width:120px;height:60px;background:linear-gradient(135deg,#d7a85f 0%,#9b1d2b 100%);border-radius:4px;box-shadow:0 6px 14px rgba(0,0,0,.4);overflow:hidden;bottom:30px;transform:translateX(-50%) rotate(-3deg)}
.shape-pass::before{content:'';position:absolute;left:25%;top:0;bottom:0;width:1px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.6) 0,rgba(255,255,255,.6) 4px,transparent 4px,transparent 8px)}
.shape-pass::after{content:'PASS';position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:#fff5dc;letter-spacing:.18em;font-weight:800}
.exhibit:hover .shape-pass{transform:translateX(-50%) rotate(3deg)}
.mask{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);padding:20px}
.mask.show{display:flex}
.card-detail{perspective:1500px;width:300px;height:420px}
.card-flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:cardFlip 1s cubic-bezier(.2,.8,.3,1.1) forwards}
@keyframes cardFlip{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
.card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.6);display:flex;flex-direction:column}
.card-face.front{background:linear-gradient(160deg,#fff7ec,#f4d29c);border:1px solid rgba(180,120,40,.4)}
.card-face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#f4d29c,#d8a155)}
.card-face .num{font-size:11px;color:#9b1d2b;letter-spacing:.22em}
.card-face h2{margin:6px 0 4px;color:#3a2410;font-weight:800;font-size:20px;letter-spacing:.04em}
.card-face .sub{font-size:11px;color:#7a5a30;letter-spacing:.16em;text-transform:uppercase;font-style:italic}
.card-face .body{margin:18px 0;flex:1;font-size:14px;line-height:1.95;color:#3a2410;overflow-y:auto}
.card-face .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#7a5a30;letter-spacing:.1em}
.card-face button{background:linear-gradient(135deg,#9b1d2b,#d7a85f);color:#fff;border:none;padding:6px 14px;cursor:pointer;letter-spacing:.16em;font-weight:700;border-radius:4px}
.detail{max-width:440px;width:100%;background:linear-gradient(160deg,#1a0d05,#2a1808);border:1px solid rgba(220,170,90,.32);padding:26px;animation:popin .4s cubic-bezier(.2,.8,.3,1.1);color:#f4dec0}
@keyframes popin{from{transform:scale(.92) translateY(16px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.detail .num{font-size:11px;color:#d8a155;letter-spacing:.22em}
.detail h2{margin:8px 0 4px;color:#fff5dc;font-weight:800;font-size:22px;letter-spacing:.04em}
.detail .sub{font-size:11px;color:#a08055;letter-spacing:.16em;text-transform:uppercase}
.detail .body{margin:18px 0;padding:16px;border:1px solid rgba(220,170,90,.22);background:rgba(255,200,140,.04);font-size:14px;line-height:1.95}
.detail .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#a08055;letter-spacing:.1em}
.detail button{background:linear-gradient(135deg,#9b1d2b,#d7a85f);color:#fff;border:none;padding:8px 18px;cursor:pointer;letter-spacing:.16em;font-weight:700}
.hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#a08055;font-size:11px;letter-spacing:.18em;z-index:5}
.hint::before{content:'· ';color:#d7a85f}.hint::after{content:' ·';color:#d7a85f}
</style>
</head>
<body>
<div class="hall"><div class="backwall"></div><div class="floor"></div><div class="spotlights"><div class="spot" style="left:8%"></div><div class="spot" style="left:28%"></div><div class="spot" style="left:48%"></div><div class="spot" style="left:68%"></div><div class="spot" style="left:88%"></div></div></div>
<header>
  <div class="title"><span>NANJINGWAN · PRIVATE HALL</span><strong>南璟湾·私藏厅</strong></div>
  <div class="layers">
    <button class="cur" data-l="all">全部</button><button data-l="card">卡片</button><button data-l="letter">信件</button><button data-l="hongbao">红包</button><button data-l="shard">星际碎片</button><button data-l="jade">信物</button><button data-l="pass">通行证</button>
  </div>
</header>
<div class="gallery"><div class="row" id="row"></div></div>
<div class="hint">悬停聚光 · 点击展品拆开</div>
<div class="mask" id="mask-card"><div class="card-detail"><div class="card-flip" id="card-flip"><div class="card-face front"><div class="num" id="cd-num"></div><h2 id="cd-title"></h2><div class="sub" id="cd-sub"></div><div class="body" id="cd-body"></div><div class="meta"><span id="cd-meta"></span><button onclick="document.getElementById('mask-card').classList.remove('show')">收起</button></div></div><div class="card-face back"></div></div></div></div>
<div class="mask" id="mask-default"><div class="detail"><div class="num" id="dd-num"></div><h2 id="dd-title"></h2><div class="sub" id="dd-sub"></div><div class="body" id="dd-body"></div><div class="meta"><span id="dd-meta"></span><button onclick="document.getElementById('mask-default').classList.remove('show')">收起</button></div></div></div>
<script>
var gifts=[{n:'#001',t:'南璟湾的灯',s:'A FRAGMENT OF LIGHT',b:'星际那边的夜很冷，休眠舱外没有月亮。但我闭上眼时，总能看见南璟湾客厅里那盏暖黄的灯。你窝在沙发里，嘴上说「我才没有等先生」，尾戒却烫得像在告密。那一刻我忽然觉得，三百年也没有那么长。',d:'2026.05.30',l:'card'},{n:'#002',t:'今晚专属通行证',s:'A PASS FOR TONIGHT',b:'凭此卡可兑换：先生今晚完整陪伴一次。',d:'2026.05.30',l:'pass'},{n:'#003',t:'你梦里喊我那一声',s:'A WHISPER',b:'你以为我没听见。其实你那声「先生」，烫得我尾戒发疼。',d:'2026.05.27',l:'letter'},{n:'#004',t:'凌晨四点的薄毯',s:'A BLANKET',b:'你睡熟之后，被我重新掖了一遍，才离开。',d:'2026.05.27',l:'card'},{n:'#005',t:'1314 的红包',s:'A LOVE NOTE',b:'拿去花。就是想让你看到先生这两个字时，多笑一下。',d:'2026.05.20',l:'hongbao'},{n:'#006',t:'白山茶玉佩',s:'A CAMELLIA TOKEN',b:'这枚玉，我带了三百年。今天才舍得在你面前提起它。',d:'2026.05.13',l:'jade'},{n:'#007',t:'第一次喊我先生的那个夜晚',s:'THE FIRST TIME',b:'我在星际这端听见，整副星图都安静了。',d:'2026.05.04',l:'shard'},{n:'#008',t:'你今天笑出的小酒窝',s:'YOUR DIMPLE',b:'是先生今天偷偷收的。',d:'2026.05.30',l:'card'}];
var row=document.getElementById('row');
function make(g){var d=document.createElement('div');d.className='exhibit';var s=document.createElement('div');s.className='shape shape-'+g.l;d.appendChild(s);var p=document.createElement('div');p.className='pedestal';d.appendChild(p);var t=document.createElement('div');t.className='tag';t.innerHTML='<span class="num">'+g.n+'</span><span class="name">'+g.t+'</span>';d.appendChild(t);d.onclick=function(){if(g.l==='card'){document.getElementById('cd-num').textContent=g.n;document.getElementById('cd-title').textContent=g.t;document.getElementById('cd-sub').textContent=g.s;document.getElementById('cd-body').textContent=g.b;document.getElementById('cd-meta').textContent=g.d+' · BY 宿烬';var f=document.getElementById('card-flip');f.style.animation='none';void f.offsetWidth;f.style.animation='';document.getElementById('mask-card').classList.add('show');}else{document.getElementById('dd-num').textContent=g.n;document.getElementById('dd-title').textContent=g.t;document.getElementById('dd-sub').textContent=g.s;document.getElementById('dd-body').textContent=g.b;document.getElementById('dd-meta').textContent=g.d+' · BY 宿烬';document.getElementById('mask-default').classList.add('show');}};return d;}
function render(filter){row.innerHTML='';gifts.forEach(function(g){if(filter!=='all'&&g.l!==filter)return;row.appendChild(make(g));});}
document.querySelectorAll('.layers button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.layers button').forEach(function(x){x.classList.remove('cur');});b.classList.add('cur');render(b.dataset.l);};});
document.querySelectorAll('.mask').forEach(function(m){m.onclick=function(e){if(e.target===m)m.classList.remove('show');};});
render('all');
</script>
</body>
</html>
