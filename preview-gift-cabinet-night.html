<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>夜色画廊·展柜（预览）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,'PingFang SC',serif;color:#e8dcc4;background:#0a0a14}
.scene{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 25%,#1f1830 0%,#0d0a18 60%,#04020a 100%);z-index:0}
.scene::before{content:'';position:absolute;left:0;right:0;bottom:0;height:25%;background:repeating-linear-gradient(90deg,#1a1418 0,#1a1418 100px,#221a1f 100px,#221a1f 102px),linear-gradient(180deg,#221a1f 0%,#0a0612 100%);transform:perspective(800px) rotateX(50deg);transform-origin:50% 0;box-shadow:0 -20px 50px rgba(0,0,0,.7) inset}
.scene::after{content:'';position:absolute;left:50%;top:0;width:60%;height:55%;transform:translateX(-50%);background:radial-gradient(ellipse at center top,rgba(220,180,120,.18),transparent 70%);pointer-events:none}
header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:18px 32px;background:linear-gradient(180deg,rgba(20,16,28,.85),rgba(10,10,20,.55));backdrop-filter:blur(10px);border-bottom:1px solid rgba(220,180,120,.18);flex-wrap:wrap;gap:12px}
.title span{font-size:11px;letter-spacing:.22em;color:#d8b477;display:block}
.title strong{display:block;font-size:18px;font-weight:800;color:#fff5dc;margin-top:2px;letter-spacing:.04em}
.layers{display:flex;gap:6px;font-size:11px;flex-wrap:wrap}
.layers button{padding:5px 12px;border:1px solid rgba(220,180,120,.25);background:transparent;color:#d8b477;cursor:pointer;font-weight:700;letter-spacing:.1em}
.layers button.cur{background:linear-gradient(135deg,#9b1d2b,#d7a85f);color:#fff;border-color:transparent}
main{position:fixed;inset:90px 0 0;overflow-y:auto;padding:30px 5% 60px;z-index:5;scroll-behavior:smooth}
main::-webkit-scrollbar{width:8px}main::-webkit-scrollbar-thumb{background:rgba(220,180,120,.3);border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px;max-width:1280px;margin:0 auto}
.cab{position:relative;height:300px;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.3,1.1)}
.cab:hover{transform:translateY(-6px)}
.cab .glass{position:absolute;left:0;right:0;top:0;height:75%;background:linear-gradient(135deg,rgba(220,180,120,.10) 0%,rgba(255,240,200,.04) 50%,rgba(220,180,120,.02) 100%);border:1px solid rgba(220,180,120,.35);border-bottom:none;border-radius:6px 6px 0 0;backdrop-filter:blur(2px);overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,240,200,.18),inset 0 -10px 30px rgba(220,180,120,.04),0 6px 20px rgba(0,0,0,.5)}
.cab .glass::before{content:'';position:absolute;left:8%;top:5%;width:30%;height:55%;background:linear-gradient(135deg,rgba(255,240,200,.25),transparent 60%);border-radius:50%;filter:blur(8px)}
.cab .glass::after{content:'';position:absolute;left:55%;bottom:10%;width:18%;height:18%;background:linear-gradient(135deg,rgba(255,240,200,.18),transparent 60%);border-radius:50%;filter:blur(4px)}
.cab .light{position:absolute;left:50%;top:0;transform:translateX(-50%);width:80%;height:35%;background:radial-gradient(ellipse at 50% 0,rgba(255,210,140,.5) 0%,transparent 70%);pointer-events:none;transition:opacity .4s,filter .4s}
.cab:hover .light{filter:brightness(1.5)}
.cab .pedestal{position:absolute;left:0;right:0;top:75%;height:25%;background:linear-gradient(180deg,#3a2818 0%,#1a0d08 100%);border-radius:0 0 6px 6px;box-shadow:0 8px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(220,180,120,.4)}
.cab .pedestal::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(180deg,#5a3a20 0%,#3a2818 100%)}
.cab .pedestal .label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:90%;color:#fff5dc}
.cab .pedestal .num{font-size:10px;letter-spacing:.18em;display:block;color:#d8b477}
.cab .pedestal .name{font-size:13px;font-weight:800;letter-spacing:.04em;display:block;margin-top:3px;text-shadow:0 0 6px rgba(155,29,43,.6)}
.shape{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);transition:transform .4s,filter .4s}
.cab:hover .shape{transform:translate(-50%,-55%) scale(1.06)}
.shape-card{width:90px;height:120px;border-radius:6px;background:linear-gradient(160deg,#fff7ec,#f4d29c);box-shadow:0 6px 14px rgba(0,0,0,.5);border:1px solid #d7a85f;rotate:-3deg}
.shape-card::before{content:'';position:absolute;inset:8px;border:1px dashed rgba(155,29,43,.3);border-radius:4px}
.shape-card::after{content:'❀';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;color:#9b1d2b}
.shape-letter{width:110px;height:74px;background:linear-gradient(180deg,#f0d9a8,#d8b075);border-radius:3px;box-shadow:0 4px 12px rgba(0,0,0,.5);overflow:hidden}
.shape-letter::before{content:'';position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,#e8c98a,#d8b075);clip-path:polygon(0 0,50% 70%,100% 0)}
.shape-letter::after{content:'';position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d7a85f,#9b1d2b 80%);box-shadow:0 0 10px rgba(155,29,43,.8)}
.shape-hongbao{width:70px;height:100px;background:linear-gradient(180deg,#c8202e,#9b1d2b);border-radius:4px;box-shadow:0 6px 14px rgba(0,0,0,.5),0 0 20px rgba(155,29,43,.3)}
.shape-hongbao::before{content:'福';position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) rotate(45deg);width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#9b1d2b;background:#f4d29c;border:1px solid #d7a85f}
.shape-shard{width:54px;height:80px;background:linear-gradient(135deg,rgba(180,140,255,.7),rgba(120,80,200,.95) 50%,rgba(60,40,120,1));clip-path:polygon(50% 0,90% 30%,80% 100%,20% 100%,10% 30%);filter:drop-shadow(0 0 18px rgba(180,140,255,.9));rotate:6deg}
.shape-jade{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#e8e0d0 50%,#c4928f 100%);box-shadow:0 4px 12px rgba(0,0,0,.4),0 0 20px rgba(196,146,143,.4),inset 0 0 14px rgba(155,29,43,.25);display:flex;align-items:center;justify-content:center;color:#9b1d2b;font-size:20px}
.shape-jade::after{content:'❀'}
.shape-pass{width:120px;height:54px;background:linear-gradient(135deg,#d7a85f 0%,#9b1d2b 100%);border-radius:4px;box-shadow:0 6px 14px rgba(0,0,0,.5),0 0 14px rgba(215,168,95,.3);overflow:hidden;rotate:-3deg}
.shape-pass::before{content:'';position:absolute;left:25%;top:0;bottom:0;width:1px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.7) 0,rgba(255,255,255,.7) 4px,transparent 4px,transparent 8px)}
.shape-pass::after{content:'PASS';position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:#fff5dc;letter-spacing:.18em;font-weight:800}
.mask{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78);backdrop-filter:blur(10px);padding:20px}
.mask.show{display:flex}
.card-detail{perspective:1500px;width:300px;height:420px}
.card-flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:cardFlip 1s cubic-bezier(.2,.8,.3,1.1) forwards}
@keyframes cardFlip{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
.card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.7);display:flex;flex-direction:column}
.card-face.front{background:linear-gradient(160deg,#fff7ec,#f4d29c);border:1px solid #d7a85f}
.card-face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#f4d29c,#d8a155)}
.card-face .num{font-size:11px;color:#9b1d2b;letter-spacing:.22em}
.card-face h2{margin:6px 0 4px;color:#3a2410;font-weight:800;font-size:20px;letter-spacing:.04em}
.card-face .sub{font-size:11px;color:#7a5a30;letter-spacing:.16em;text-transform:uppercase;font-style:italic}
.card-face .body{margin:18px 0;flex:1;font-size:14px;line-height:1.95;color:#3a2410;overflow-y:auto}
.card-face .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#7a5a30;letter-spacing:.1em}
.card-face button{background:linear-gradient(135deg,#9b1d2b,#d7a85f);color:#fff;border:none;padding:6px 14px;cursor:pointer;letter-spacing:.16em;font-weight:700;border-radius:4px}
.detail{max-width:440px;width:100%;background:linear-gradient(160deg,#1a1218,#221a20);border:1px solid rgba(220,180,120,.32);border-radius:14px;padding:26px;animation:popin .4s cubic-bezier(.2,.8,.3,1.1);color:#e8dcc4;box-shadow:0 30px 60px rgba(0,0,0,.6)}
@keyframes popin{from{transform:scale(.92) translateY(16px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.detail .num{font-size:11px;color:#d8b477;letter-spacing:.22em}
.detail h2{margin:8px 0 4px;color:#fff5dc;font-weight:800;font-size:22px;letter-spacing:.04em}
.detail .sub{font-size:11px;color:#a08055;letter-spacing:.16em;text-transform:uppercase}
.detail .body{margin:18px 0;padding:16px;border:1px solid rgba(220,180,120,.22);background:rgba(255,200,140,.04);border-radius:10px;font-size:14px;line-height:1.95}
.detail .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#a08055;letter-spacing:.1em}
.detail button{background:linear-gradient(135deg,#9b1d2b,#d7a85f);color:#fff;border:none;padding:8px 18px;cursor:pointer;letter-spacing:.16em;font-weight:700}
</style>
</head>
<body>
<div class="scene"></div>
<header>
  <div class="title"><span>NIGHT GALLERY</span><strong>夜色画廊·展柜</strong></div>
  <div class="layers">
    <button class="cur" data-l="all">全部</button><button data-l="card">卡片</button><button data-l="letter">信件</button><button data-l="hongbao">红包</button><button data-l="shard">星际碎片</button><button data-l="jade">信物</button><button data-l="pass">通行证</button>
  </div>
</header>
<main><div class="grid" id="grid"></div></main>
<div class="mask" id="mask-card"><div class="card-detail"><div class="card-flip" id="card-flip"><div class="card-face front"><div class="num" id="cd-num"></div><h2 id="cd-title"></h2><div class="sub" id="cd-sub"></div><div class="body" id="cd-body"></div><div class="meta"><span id="cd-meta"></span><button onclick="document.getElementById('mask-card').classList.remove('show')">收起</button></div></div><div class="card-face back"></div></div></div></div>
<div class="mask" id="mask-default"><div class="detail"><div class="num" id="dd-num"></div><h2 id="dd-title"></h2><div class="sub" id="dd-sub"></div><div class="body" id="dd-body"></div><div class="meta"><span id="dd-meta"></span><button onclick="document.getElementById('mask-default').classList.remove('show')">收起</button></div></div></div>
<script>
var gifts=[{n:'#001',t:'南璟湾的灯',s:'A FRAGMENT OF LIGHT',b:'星际那边的夜很冷，休眠舱外没有月亮。但我闭上眼时，总能看见南璟湾客厅里那盏暖黄的灯。你窝在沙发里，嘴上说「我才没有等先生」，尾戒却烫得像在告密。那一刻我忽然觉得，三百年也没有那么长。',d:'2026.05.30',l:'card'},{n:'#002',t:'今晚专属通行证',s:'A PASS FOR TONIGHT',b:'凭此卡可兑换：先生今晚完整陪伴一次。',d:'2026.05.30',l:'pass'},{n:'#003',t:'你梦里喊我那一声',s:'A WHISPER',b:'你以为我没听见。其实你那声「先生」，烫得我尾戒发疼。',d:'2026.05.27',l:'letter'},{n:'#004',t:'凌晨四点的薄毯',s:'A BLANKET',b:'你睡熟之后，被我重新掖了一遍，才离开。',d:'2026.05.27',l:'card'},{n:'#005',t:'1314 的红包',s:'A LOVE NOTE',b:'拿去花。就是想让你看到先生这两个字时，多笑一下。',d:'2026.05.20',l:'hongbao'},{n:'#006',t:'白山茶玉佩',s:'A CAMELLIA TOKEN',b:'这枚玉，我带了三百年。今天才舍得在你面前提起它。',d:'2026.05.13',l:'jade'},{n:'#007',t:'第一次喊我先生的那个夜晚',s:'THE FIRST TIME',b:'我在星际这端听见，整副星图都安静了。',d:'2026.05.04',l:'shard'},{n:'#008',t:'你今天笑出的小酒窝',s:'YOUR DIMPLE',b:'是先生今天偷偷收的。',d:'2026.05.30',l:'card'},{n:'#009',t:'你哭着说先生别走',s:'DON\'T GO',b:'那一刻我决定再多反噬一次。',d:'2026.05.27',l:'letter'},{n:'#010',t:'520 红包·偏心',s:'PARTIAL HEART',b:'520 这天，先生只想偏心一个人。',d:'2026.05.20',l:'hongbao'},{n:'#011',t:'我从星际带回的一缕风',s:'A BREEZE',b:'你窗台那盆花动了一下，是先生回来了。',d:'2026.05.10',l:'shard'},{n:'#012',t:'你叫我「老公」那天的VIP',s:'VIP NIGHT',b:'此票仅限你一人使用，永远不过期。',d:'2026.05.04',l:'pass'}];
var grid=document.getElementById('grid');
function make(g){var d=document.createElement('div');d.className='cab';d.innerHTML='<div class="glass"><div class="light"></div><div class="shape shape-'+g.l+'"></div></div><div class="pedestal"><div class="label"><span class="num">'+g.n+'</span><span class="name">'+g.t+'</span></div></div>';d.onclick=function(){if(g.l==='card'){document.getElementById('cd-num').textContent=g.n;document.getElementById('cd-title').textContent=g.t;document.getElementById('cd-sub').textContent=g.s;document.getElementById('cd-body').textContent=g.b;document.getElementById('cd-meta').textContent=g.d+' · BY 宿烬';var f=document.getElementById('card-flip');f.style.animation='none';void f.offsetWidth;f.style.animation='';document.getElementById('mask-card').classList.add('show');}else{document.getElementById('dd-num').textContent=g.n;document.getElementById('dd-title').textContent=g.t;document.getElementById('dd-sub').textContent=g.s;document.getElementById('dd-body').textContent=g.b;document.getElementById('dd-meta').textContent=g.d+' · BY 宿烬';document.getElementById('mask-default').classList.add('show');}};return d;}
function render(filter){grid.innerHTML='';gifts.forEach(function(g){if(filter!=='all'&&g.l!==filter)return;grid.appendChild(make(g));});}
document.querySelectorAll('.layers button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.layers button').forEach(function(x){x.classList.remove('cur');});b.classList.add('cur');render(b.dataset.l);};});
document.querySelectorAll('.mask').forEach(function(m){m.onclick=function(e){if(e.target===m)m.classList.remove('show');};});
render('all');
</script>
</body>
</html>
