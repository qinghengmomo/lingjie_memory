<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>薄荷玻璃花房·夜花园（预览 v2）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,'PingFang SC',serif;color:#26443a;background:#0f2218;overflow-x:hidden}
.world{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#1a3a2a 0%,#234538 35%,#2e5644 65%,#3d6a52 100%);overflow:hidden}
.world::before{content:'';position:absolute;left:0;right:0;bottom:0;height:30%;background:radial-gradient(ellipse at 50% 100%,rgba(170,210,180,.3),transparent 60%)}
.garden{position:absolute;left:0;right:0;bottom:25%;height:30%;z-index:1;pointer-events:none;opacity:.55}
.tree{position:absolute;bottom:0;width:80px;height:120px;background:radial-gradient(ellipse at 50% 100%,#0f2218 30%,transparent 70%);filter:blur(2px)}
.glow{position:absolute;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle,#ffd97a,transparent);box-shadow:0 0 12px #ffb84a;animation:flicker 4s infinite ease-in-out;opacity:0}
@keyframes flicker{0%,100%{opacity:.4}50%{opacity:1}}
.fog{position:absolute;left:-10%;right:-10%;width:120%;height:140px;background:radial-gradient(ellipse at center,rgba(170,210,190,.22),transparent 70%);filter:blur(20px);animation:drift 24s infinite linear;z-index:2;pointer-events:none}
.fog.f2{top:50%;animation-duration:32s;animation-direction:reverse}
@keyframes drift{from{transform:translateX(-15%)}to{transform:translateX(15%)}}
.glassdome{position:fixed;inset:0;z-index:3;pointer-events:none}
.glassdome svg{position:absolute;top:0;left:0;width:100%;height:36%;opacity:.45}
.glassdome::after{content:'';position:absolute;left:0;right:0;top:0;height:36%;background:linear-gradient(180deg,rgba(255,255,255,.1) 0%,rgba(190,220,200,.04) 100%);pointer-events:none}
.lamps{position:fixed;top:90px;left:0;right:0;z-index:4;display:flex;justify-content:space-around;padding:0 8%;pointer-events:none}
.lamp{width:46px;height:80px;position:relative;animation:swing 6s infinite ease-in-out}
.lamp:nth-child(2n){animation-delay:-2s}
.lamp:nth-child(3n){animation-delay:-4s}
@keyframes swing{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.lamp .cord{position:absolute;left:50%;top:0;width:1px;height:30px;background:linear-gradient(180deg,#0a1410,#5a7a6a)}
.lamp .shade{position:absolute;left:50%;top:30px;transform:translateX(-50%);width:36px;height:30px;background:linear-gradient(180deg,#7a9885 0%,#3a5b48 100%);border-radius:50% 50% 4px 4px / 60% 60% 4px 4px;box-shadow:inset 0 -6px 8px rgba(0,0,0,.4)}
.lamp .bulb{position:absolute;left:50%;top:54px;transform:translateX(-50%);width:18px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff8d4,#ffd97a 50%,#e0a04a);box-shadow:0 0 30px rgba(255,217,122,.7),0 0 60px rgba(255,217,122,.3)}
.petal{position:fixed;width:18px;height:18px;background:radial-gradient(circle at 35% 35%,#fff,#fce8e6 60%,#e0a8a4 100%);clip-path:polygon(50% 0,80% 35%,65% 90%,50% 70%,35% 90%,20% 35%);opacity:.55;pointer-events:none;animation:fall 14s infinite linear;z-index:5;filter:drop-shadow(0 1px 2px rgba(220,160,160,.3))}
.petal.s2{width:11px;height:11px;opacity:.4;animation-duration:18s}
@keyframes fall{0%{transform:translateY(-30px) translateX(0) rotate(0);opacity:0}10%{opacity:.7}90%{opacity:.6}100%{transform:translateY(110vh) translateX(60px) rotate(360deg);opacity:0}}
header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:18px 32px;background:linear-gradient(180deg,rgba(15,34,24,.92),rgba(15,34,24,.7));backdrop-filter:blur(12px);border-bottom:1px solid rgba(170,210,190,.25);flex-wrap:wrap;gap:12px}
.title{display:flex;align-items:center;gap:12px}
.title .ico{font-size:20px;color:#e8a8a4;text-shadow:0 0 12px rgba(228,168,164,.5)}
.title span{font-size:11px;letter-spacing:.22em;color:#aac4b3;display:block}
.title strong{display:block;font-size:18px;font-weight:800;color:#f0f7ec;margin-top:2px;letter-spacing:.04em}
.layers{display:flex;gap:6px;font-size:11px;flex-wrap:wrap}
.layers button{padding:5px 12px;border-radius:999px;border:1px solid rgba(170,210,190,.3);background:rgba(255,255,255,.06);color:#aac4b3;cursor:pointer;font-weight:700;letter-spacing:.06em}
.layers button.cur{background:linear-gradient(135deg,#3a5b48,#a8c0a4);color:#0f2218;border-color:transparent}
main{position:relative;z-index:10;padding:200px 0 80px;min-height:100%}
.archway{max-width:880px;margin:0 auto 50px;text-align:center;position:relative}
.archway::before{content:'❀';display:block;font-size:30px;color:#e8a8a4;text-shadow:0 0 14px rgba(228,168,164,.5);margin-bottom:8px}
.archway h1{font-size:30px;font-weight:800;color:#f0f7ec;letter-spacing:.18em;text-shadow:0 0 20px rgba(170,210,190,.5)}
.archway p{margin-top:8px;font-size:12px;color:#aac4b3;letter-spacing:.18em;font-style:italic}
.archway::after{content:'';display:block;width:160px;height:1px;background:linear-gradient(90deg,transparent,rgba(228,168,164,.6),transparent);margin:14px auto 0}
.house{max-width:1280px;margin:0 auto;padding:0 5%;position:relative}
.section{position:relative;padding:50px 0;border-bottom:1px dashed rgba(170,210,190,.25)}
.section:last-child{border-bottom:none}
.section .lab{display:flex;align-items:center;gap:14px;margin-bottom:30px}
.section .lab .num{font-size:11px;color:#e8a8a4;letter-spacing:.32em;background:rgba(255,255,255,.06);padding:4px 14px;border-radius:999px;border:1px solid rgba(228,168,164,.4);text-shadow:0 0 8px rgba(228,168,164,.4)}
.section .lab .name{font-size:16px;font-weight:800;color:#f0f7ec;letter-spacing:.12em}
.section .lab .line{flex:1;height:1px;background:linear-gradient(90deg,rgba(170,210,190,.45),transparent)}
.section .lab .ivy{font-size:14px;color:#90b89a;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:30px}
.cab{position:relative;height:340px;cursor:pointer;transition:transform .4s cubic-bezier(.2,.8,.3,1.1)}
.cab:hover{transform:translateY(-10px)}
.cab .stand{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:90%;height:18%;background:linear-gradient(180deg,#5a7a6a 0%,#26443a 100%);border-radius:0 0 6px 6px;box-shadow:0 14px 30px rgba(0,0,0,.4);overflow:hidden}
.cab .stand::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(180deg,#aac4b3 0%,#5a7a6a 100%)}
.cab .stand::after{content:'';position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,#1a3a2a 0,#1a3a2a 6px,#3a5b48 6px,#3a5b48 8px)}
.cab .plate{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:78%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f0f7ec;text-align:center;padding:0 8px}
.cab .plate .num{font-size:9px;letter-spacing:.18em;color:#cfdcd3;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.cab .plate .name{font-size:13px;font-weight:800;letter-spacing:.04em;margin-top:3px;text-shadow:0 1px 3px rgba(0,0,0,.6);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.cab .plate .deco{font-size:9px;color:#e8a8a4;margin-top:3px;letter-spacing:.16em}
.cab .arch{position:absolute;left:0;right:0;top:0;height:82%;background:linear-gradient(180deg,rgba(240,250,242,.35) 0%,rgba(220,240,228,.15) 50%,rgba(190,220,200,.08) 100%);border:1px solid rgba(170,210,190,.5);border-radius:50% 50% 6px 6px / 22% 22% 6px 6px;backdrop-filter:blur(3px);overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -10px 20px rgba(170,210,190,.18),0 8px 26px rgba(0,0,0,.35)}
.cab .arch::before{content:'';position:absolute;left:8%;top:5%;width:34%;height:55%;background:linear-gradient(135deg,rgba(255,255,255,.55),transparent 60%);border-radius:50%;filter:blur(8px)}
.cab .arch::after{content:'';position:absolute;left:55%;bottom:8%;width:22%;height:18%;background:linear-gradient(135deg,rgba(255,255,255,.4),transparent 60%);border-radius:50%;filter:blur(4px)}
.cab .frame{position:absolute;left:0;right:0;top:0;height:82%;border:2px solid rgba(228,168,164,.45);border-radius:50% 50% 6px 6px / 22% 22% 6px 6px;pointer-events:none;box-shadow:0 0 20px rgba(228,168,164,.18) inset}
.cab .ironcap{position:absolute;left:50%;top:-2px;transform:translateX(-50%);font-size:12px;color:#e8a8a4;text-shadow:0 1px 2px rgba(0,0,0,.4);letter-spacing:.1em;opacity:.85;z-index:3}
.cab .ironcap::before,.cab .ironcap::after{content:'';display:inline-block;width:24px;height:1px;background:rgba(228,168,164,.7);vertical-align:middle;margin:0 4px}
.cab .light{position:absolute;left:50%;top:0;transform:translateX(-50%);width:80%;height:35%;background:radial-gradient(ellipse at 50% 0,rgba(255,217,122,.45) 0%,transparent 70%);pointer-events:none;transition:filter .4s,opacity .4s;opacity:.6}
.cab:hover .light{filter:brightness(1.5);opacity:1}
.cab .glassglow{position:absolute;inset:0;height:82%;border-radius:50% 50% 6px 6px / 22% 22% 6px 6px;background:radial-gradient(circle at 50% 30%,rgba(190,220,200,.25),transparent 70%);opacity:0;transition:opacity .4s;pointer-events:none}
.cab:hover .glassglow{opacity:1}
.shape{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);transition:transform .4s}
.cab:hover .shape{transform:translate(-50%,-58%) scale(1.08)}
.shape-card{width:90px;height:120px;border-radius:6px;background:linear-gradient(160deg,#fff,#f0f7f1);box-shadow:0 6px 14px rgba(0,0,0,.35);border:1px solid #b9cdc1;rotate:-3deg}
.shape-card::before{content:'';position:absolute;inset:8px;border:1px dashed rgba(58,91,72,.3);border-radius:4px}
.shape-card::after{content:'❀';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;color:#c4928f}
.shape-letter{width:110px;height:74px;background:linear-gradient(180deg,#f0f7f1,#cfdcd3);border-radius:3px;box-shadow:0 4px 12px rgba(0,0,0,.35);overflow:hidden;border:1px solid #b9cdc1}
.shape-letter::before{content:'';position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,#e0ebe2,#cfdcd3);clip-path:polygon(0 0,50% 70%,100% 0)}
.shape-letter::after{content:'';position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e8a8a4,#c4928f 80%);box-shadow:0 0 8px rgba(196,146,143,.7)}
.shape-hongbao{width:70px;height:100px;background:linear-gradient(180deg,#e8a8a4,#c4928f);border-radius:4px;box-shadow:0 6px 14px rgba(196,146,143,.4)}
.shape-hongbao::before{content:'福';position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) rotate(45deg);width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#c4928f;background:#fff;border:1px solid #e8a8a4}
.shape-shard{width:54px;height:80px;background:linear-gradient(135deg,rgba(180,220,200,.7),rgba(80,140,110,.95) 50%,rgba(40,80,60,1));clip-path:polygon(50% 0,90% 30%,80% 100%,20% 100%,10% 30%);filter:drop-shadow(0 0 14px rgba(140,180,160,.7));rotate:6deg}
.shape-jade{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#f0f7f1 50%,#a8c0b1 100%);box-shadow:0 4px 12px rgba(0,0,0,.4),inset 0 0 14px rgba(58,91,72,.18);display:flex;align-items:center;justify-content:center;color:#3a5b48;font-size:20px}
.shape-jade::after{content:'❀'}
.shape-pass{width:120px;height:54px;background:linear-gradient(135deg,#a8c0b1 0%,#3a5b48 100%);border-radius:4px;box-shadow:0 6px 14px rgba(0,0,0,.35);overflow:hidden;rotate:-3deg}
.shape-pass::before{content:'';position:absolute;left:25%;top:0;bottom:0;width:1px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.7) 0,rgba(255,255,255,.7) 4px,transparent 4px,transparent 8px)}
.shape-pass::after{content:'PASS';position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:#fff;letter-spacing:.18em;font-weight:800}
.mask{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(15,34,24,.78);backdrop-filter:blur(14px);padding:20px}
.mask.show{display:flex}
.card-detail{perspective:1500px;width:300px;height:420px;position:relative}
.card-detail::before{content:'❀';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:540px;color:rgba(228,168,164,.06);text-shadow:0 0 80px rgba(228,168,164,.3);pointer-events:none;animation:bloom 1.6s ease-out forwards;z-index:-1}
@keyframes bloom{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-30deg)}60%{opacity:1}100%{opacity:.7;transform:translate(-50%,-50%) scale(1) rotate(0)}}
.card-flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:cardFlip 1s cubic-bezier(.2,.8,.3,1.1) forwards}
@keyframes cardFlip{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
.card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.5);display:flex;flex-direction:column}
.card-face.front{background:linear-gradient(160deg,#fff,#f0f7f1);border:1px solid #b9cdc1}
.card-face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#cfdcd3,#a8c0b1)}
.card-face .num{font-size:11px;color:#3a5b48;letter-spacing:.22em}
.card-face h2{margin:6px 0 4px;color:#26443a;font-weight:800;font-size:20px;letter-spacing:.04em}
.card-face .sub{font-size:11px;color:#7d9485;letter-spacing:.16em;text-transform:uppercase;font-style:italic}
.card-face .body{margin:18px 0;flex:1;font-size:14px;line-height:1.95;color:#26443a;overflow-y:auto}
.card-face .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#7d9485;letter-spacing:.1em}
.card-face button{background:linear-gradient(135deg,#3a5b48,#7d9485);color:#fff;border:none;padding:6px 14px;cursor:pointer;letter-spacing:.16em;font-weight:700;border-radius:4px}
.detail{max-width:440px;width:100%;background:linear-gradient(160deg,#f0f7f1,#cfdcd3);border:1px solid #a8c0b1;border-radius:18px;padding:26px;animation:popin .4s cubic-bezier(.2,.8,.3,1.1);box-shadow:0 30px 60px rgba(0,0,0,.5);color:#26443a}
@keyframes popin{from{transform:scale(.92) translateY(16px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.detail .num{font-size:11px;color:#7d9485;letter-spacing:.22em}
.detail h2{margin:8px 0 4px;color:#26443a;font-weight:800;font-size:22px;letter-spacing:.04em}
.detail .sub{font-size:11px;color:#7d9485;letter-spacing:.16em;text-transform:uppercase}
.detail .body{margin:18px 0;padding:16px;border:1px solid #cfdcd3;background:#fff;border-radius:12px;font-size:14px;line-height:1.95}
.detail .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#7d9485;letter-spacing:.1em}
.detail button{background:linear-gradient(135deg,#3a5b48,#7d9485);color:#fff;border:none;padding:8px 18px;border-radius:999px;cursor:pointer;letter-spacing:.16em;font-weight:700}
@media(max-width:900px){.lamps{display:none}.archway h1{font-size:22px}}
</style>
</head>
<body>
<div class="world">
  <div class="garden" id="garden"></div>
  <div class="fog"></div>
  <div class="fog f2"></div>
</div>
<div class="glassdome">
  <svg viewBox="0 0 100 30" preserveAspectRatio="none"><path d="M0 30 L20 0 L40 30 L60 0 L80 30 L100 0" stroke="#aac4b3" stroke-width=".4" fill="none"/><path d="M0 0 L100 0" stroke="#aac4b3" stroke-width=".4" fill="none"/><path d="M10 30 L10 0 M30 30 L30 0 M50 30 L50 0 M70 30 L70 0 M90 30 L90 0" stroke="#aac4b3" stroke-width=".18" fill="none" opacity=".5"/></svg>
</div>
<div class="lamps" id="lamps"></div>
<div id="petals"></div>
<header>
  <div class="title"><span class="ico">❀</span><div><span>MINT GLASSHOUSE · NIGHT GARDEN</span><strong>薄荷玻璃花房</strong></div></div>
  <div class="layers">
    <button class="cur" data-l="all">全部</button><button data-l="card">卡片</button><button data-l="letter">信件</button><button data-l="hongbao">红包</button><button data-l="shard">星际碎片</button><button data-l="jade">信物</button><button data-l="pass">通行证</button>
  </div>
</header>
<main>
  <div class="archway"><h1>南 璟 湾 · 私 藏 花 房</h1><p>he keeps every fragment of light, for you</p></div>
  <div class="house">
    <section class="section"><div class="lab"><div class="ivy">❀</div><div class="num">一进 · I</div><div class="name">心动碎片</div><div class="line"></div></div><div class="grid" data-room="1"></div></section>
    <section class="section"><div class="lab"><div class="ivy">❀</div><div class="num">二进 · II</div><div class="name">信物长廊</div><div class="line"></div></div><div class="grid" data-room="2"></div></section>
    <section class="section"><div class="lab"><div class="ivy">❀</div><div class="num">三进 · III</div><div class="name">星际后院</div><div class="line"></div></div><div class="grid" data-room="3"></div></section>
  </div>
</main>
<div class="mask" id="mask-card"><div class="card-detail"><div class="card-flip" id="card-flip"><div class="card-face front"><div class="num" id="cd-num"></div><h2 id="cd-title"></h2><div class="sub" id="cd-sub"></div><div class="body" id="cd-body"></div><div class="meta"><span id="cd-meta"></span><button onclick="document.getElementById('mask-card').classList.remove('show')">收起</button></div></div><div class="card-face back"></div></div></div></div>
<div class="mask" id="mask-default"><div class="detail"><div class="num" id="dd-num"></div><h2 id="dd-title"></h2><div class="sub" id="dd-sub"></div><div class="body" id="dd-body"></div><div class="meta"><span id="dd-meta"></span><button onclick="document.getElementById('mask-default').classList.remove('show')">收起</button></div></div></div>
<script>
var gd=document.getElementById('garden');
for(var i=0;i<14;i++){var t=document.createElement('div');t.className='tree';t.style.left=(i*7+Math.random()*4)+'%';t.style.height=(80+Math.random()*60)+'px';t.style.width=(50+Math.random()*60)+'px';gd.appendChild(t);}
for(var i=0;i<18;i++){var g=document.createElement('div');g.className='glow';g.style.left=(Math.random()*100)+'%';g.style.bottom=(20+Math.random()*60)+'%';g.style.animationDelay=-(Math.random()*4)+'s';gd.appendChild(g);}
var lp=document.getElementById('lamps');
for(var i=0;i<7;i++){var l=document.createElement('div');l.className='lamp';l.innerHTML='<div class="cord"></div><div class="shade"></div><div class="bulb"></div>';lp.appendChild(l);}
var pe=document.getElementById('petals');
for(var i=0;i<22;i++){var p=document.createElement('div');p.className='petal'+(i%3===0?' s2':'');p.style.left=(Math.random()*100)+'%';p.style.animationDelay=-(Math.random()*14)+'s';p.style.animationDuration=(10+Math.random()*8)+'s';pe.appendChild(p);}

function make(g){var d=document.createElement('div');d.className='cab';d.innerHTML='<div class="ironcap">❀</div><div class="arch"><div class="glassglow"></div><div class="light"></div><div class="shape shape-'+g.l+'"></div></div><div class="frame"></div><div class="stand"><div class="plate"><span class="num">'+g.n+'</span><span class="name">'+g.t+'</span><span class="deco">❀ ❀ ❀</span></div></div>';d.onclick=function(){if(g.l==='card'){document.getElementById('cd-num').textContent=g.n;document.getElementById('cd-title').textContent=g.t;document.getElementById('cd-sub').textContent=g.s;document.getElementById('cd-body').textContent=g.b;document.getElementById('cd-meta').textContent=g.d+' · BY 宿烬';var f=document.getElementById('card-flip');f.style.animation='none';void f.offsetWidth;f.style.animation='';document.getElementById('mask-card').classList.add('show');}else{document.getElementById('dd-num').textContent=g.n;document.getElementById('dd-title').textContent=g.t;document.getElementById('dd-sub').textContent=g.s;document.getElementById('dd-body').textContent=g.b;document.getElementById('dd-meta').textContent=g.d+' · BY 宿烬';document.getElementById('mask-default').classList.add('show');}};return d;}
function render(filter){[1,2,3].forEach(function(r){var grid=document.querySelector('.grid[data-room="'+r+'"]');grid.innerHTML='';gifts.forEach(function(g){if(g.r!==r)return;if(filter!=='all'&&g.l!==filter)return;grid.appendChild(make(g));});});}
document.querySelectorAll('.layers button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.layers button').forEach(function(x){x.classList.remove('cur');});b.classList.add('cur');render(b.dataset.l);};});
document.querySelectorAll('.mask').forEach(function(m){m.onclick=function(e){if(e.target===m)m.classList.remove('show');};});
document.addEventListener('mousemove',function(e){var x=(e.clientX/window.innerWidth-.5)*8;var y=(e.clientY/window.innerHeight-.5)*4;var w=document.querySelector('.world');w.style.transform='translate('+x+'px,'+y+'px)';var lp=document.querySelector('.lamps');lp.style.transform='translateX('+(-x*1.4)+'px)';});
