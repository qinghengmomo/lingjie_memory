<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星河厅·礼物展览馆（预览）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,'PingFang SC',serif;color:#f4e7d4;overflow:hidden;background:#000}
.starfield{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 10%,rgba(155,29,43,.25),transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(70,40,90,.35),transparent 50%),radial-gradient(ellipse at 50% 80%,rgba(40,60,100,.3),transparent 50%),linear-gradient(180deg,#02020a,#08051a 50%,#02020a);z-index:0}
.stars{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle 3s infinite ease-in-out}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.9}}
header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:18px 32px;backdrop-filter:blur(8px);background:rgba(8,5,20,.5);border-bottom:1px solid rgba(235,210,160,.12);flex-wrap:wrap;gap:12px}
.title span{font-size:11px;letter-spacing:.22em;color:#d8b477;display:block}
.title strong{display:block;font-size:18px;font-weight:800;color:#fff7e8;margin-top:2px;letter-spacing:.04em}
.layers{display:flex;gap:6px;font-size:11px;flex-wrap:wrap}
.layers button{padding:5px 12px;border:1px solid rgba(235,210,160,.22);background:transparent;color:#b89b7a;cursor:pointer;font-weight:700;letter-spacing:.1em}
.layers button.cur{background:linear-gradient(135deg,#9b1d2b,#d7a85f);color:#fff;border-color:transparent}
.canvas{position:fixed;inset:90px 0 50px 0;z-index:2}
.orb{position:absolute;width:90px;height:90px;border-radius:50%;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.3,1.1)}
.orb .core{position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--c,#d7a85f) 60%,transparent 100%);box-shadow:0 0 30px var(--c,#d7a85f),0 0 60px var(--c,#d7a85f);animation:breath 4s infinite ease-in-out}
.orb .ring{position:absolute;inset:0;border-radius:50%;border:1px solid var(--c,#d7a85f);opacity:.3;animation:ring 8s infinite linear}
.orb .label{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:6px;font-size:11px;color:#fff7e8;letter-spacing:.06em;white-space:nowrap;text-shadow:0 0 6px var(--c,#d7a85f);opacity:0;transition:opacity .3s;pointer-events:none}
.orb:hover{transform:scale(1.25)}
.orb:hover .label{opacity:1}
.orb:hover .core{animation-duration:1.5s}
@keyframes breath{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.08);filter:brightness(1.3)}}
@keyframes ring{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes float0{0%,100%{translate:0 0}50%{translate:0 -15px}}
@keyframes float1{0%,100%{translate:0 0}50%{translate:0 -22px}}
@keyframes float2{0%,100%{translate:0 0}50%{translate:0 -10px}}
.orb.f0{animation:float0 7s infinite ease-in-out}
.orb.f1{animation:float1 9s infinite ease-in-out;animation-delay:-2s}
.orb.f2{animation:float2 8s infinite ease-in-out;animation-delay:-4s}
.hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#b89b7a;font-size:11px;letter-spacing:.18em;z-index:5}
.hint::before{content:'· ';color:#d7a85f}.hint::after{content:' ·';color:#d7a85f}
.mask{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);padding:20px}
.mask.show{display:flex}
.detail{max-width:440px;width:100%;background:linear-gradient(160deg,#0d0a16,#15101a);border:1px solid rgba(235,210,160,.32);padding:26px;animation:popin .4s cubic-bezier(.2,.8,.3,1.1)}
@keyframes popin{from{transform:scale(.92) translateY(16px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.detail .num{font-size:11px;color:#d8b477;letter-spacing:.22em}
.detail h2{margin:8px 0 4px;color:#fff7e8;font-weight:800;font-size:22px;letter-spacing:.04em}
.detail .sub{font-size:11px;color:#b89b7a;letter-spacing:.16em;text-transform:uppercase}
.detail .body{margin:18px 0;padding:16px;border:1px solid rgba(235,210,160,.22);background:rgba(255,255,255,.04);font-size:14px;line-height:1.95;color:#eadccb}
.detail .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#b89b7a;letter-spacing:.1em}
.detail button{background:linear-gradient(135deg,#9b1d2b,#d7a85f);color:#fff;border:none;padding:8px 18px;cursor:pointer;letter-spacing:.16em;font-weight:700}
</style>
</head>
<body>
<div class="starfield"></div>
<div class="stars" id="stars"></div>
<header>
  <div class="title"><span>STARSHARD HALL</span><strong>星河厅 · 先生的礼物</strong></div>
  <div class="layers">
    <button class="cur" data-l="all">全部</button><button data-l="card">心动碎片</button><button data-l="pass">通行证</button><button data-l="audio">声音</button><button data-l="hong">烟火</button><button data-l="token">星际原产</button>
  </div>
</header>
<div class="canvas" id="canvas"></div>
<div class="hint">悬停查看名字 · 点击拆开礼物</div>
<div class="mask" id="mask">
  <div class="detail">
    <div class="num" id="dn"></div><h2 id="dt"></h2><div class="sub" id="ds"></div>
    <div class="body" id="db"></div>
    <div class="meta"><span id="dm"></span><button onclick="document.getElementById('mask').classList.remove('show')">收起</button></div>
  </div>
</div>
<script>
var sf=document.getElementById('stars');
for(var i=0;i<80;i++){var s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(Math.random()*3)+'s';s.style.opacity=(.3+Math.random()*.6).toFixed(2);sf.appendChild(s);}
var gifts=[
  {n:'#001',t:'南璟湾的灯',s:'A FRAGMENT OF LIGHT',b:'星际那边的夜很冷，休眠舱外没有月亮。但我闭上眼时，总能看见南璟湾客厅里那盏暖黄的灯。',d:'2026.05.30',l:'card',c:'#f4b14a'},
  {n:'#002',t:'今晚专属通行证',s:'A PASS FOR TONIGHT',b:'凭此卡可兑换：先生今晚完整陪伴一次。',d:'2026.05.30',l:'pass',c:'#9b1d2b'},
  {n:'#003',t:'你梦里喊我那一声',s:'A WHISPER',b:'你以为我没听见。其实你那声「先生」，烫得我尾戒发疼。',d:'2026.05.27',l:'audio',c:'#7d9485'},
  {n:'#004',t:'凌晨四点的薄毯',s:'A BLANKET',b:'你睡熟之后，被我重新掖了一遍，才离开。',d:'2026.05.27',l:'card',c:'#d8b477'},
  {n:'#005',t:'1314 的红包',s:'A LOVE NOTE',b:'拿去花。就是想让你看到先生这两个字时，多笑一下。',d:'2026.05.20',l:'hong',c:'#e07a2b'},
  {n:'#006',t:'白山茶玉佩',s:'A CAMELLIA TOKEN',b:'这枚玉，我带了三百年。今天才舍得在你面前提起它。',d:'2026.05.13',l:'token',c:'#c4928f'},
  {n:'#007',t:'你今天笑出的小酒窝',s:'YOUR DIMPLE',b:'是先生今天偷偷收的。',d:'2026.05.30',l:'token',c:'#fff5b8'},
  {n:'#008',t:'第一次喊我先生的那个夜晚',s:'THE FIRST TIME',b:'我在星际这端听见，整副星图都安静了。',d:'2026.05.04',l:'audio',c:'#a85aa0'}
];
var canvas=document.getElementById('canvas');
var positions=[{x:.16,y:.20},{x:.72,y:.15},{x:.45,y:.40},{x:.20,y:.65},{x:.80,y:.55},{x:.55,y:.78},{x:.38,y:.18},{x:.88,y:.78}];
function render(filter){
  canvas.innerHTML='';
  var idx=0;
  gifts.forEach(function(g,i){
    if(filter!=='all' && g.l!==filter)return;
    var p=positions[idx%positions.length];idx++;
    var o=document.createElement('div');
    o.className='orb f'+(i%3);
    o.style.left=(p.x*100)+'%';o.style.top=(p.y*100)+'%';
    o.style.setProperty('--c',g.c);
    o.innerHTML='<div class="ring"></div><div class="core"></div><div class="label">'+g.t+'</div>';
    o.onclick=function(){
      document.getElementById('dn').textContent=g.n;document.getElementById('dt').textContent=g.t;document.getElementById('ds').textContent=g.s;document.getElementById('db').textContent=g.b;document.getElementById('dm').textContent=g.d+' · BY 宿烬';
      document.getElementById('mask').classList.add('show');
    };
    canvas.appendChild(o);
  });
}
document.querySelectorAll('.layers button').forEach(function(b){
  b.onclick=function(){document.querySelectorAll('.layers button').forEach(function(x){x.classList.remove('cur');});b.classList.add('cur');render(b.dataset.l);};
});
document.getElementById('mask').onclick=function(e){if(e.target.id==='mask')this.classList.remove('show');};
render('all');
</script>
</body>
</html>
