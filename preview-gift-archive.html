<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星际私藏档案馆（预览）</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:-apple-system,'PingFang SC','Times New Roman',serif;color:#f4e7d4;min-height:100vh;background:radial-gradient(circle at 18% -10%,rgba(155,29,43,.35),transparent 40%),radial-gradient(circle at 90% 10%,rgba(235,210,160,.18),transparent 38%),linear-gradient(180deg,#08080b,#15101a 60%,#08080a)}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 22px;border-bottom:1px solid rgba(235,210,160,.18);flex-wrap:wrap;gap:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand .star{width:8px;height:8px;border-radius:50%;background:#d7a85f;box-shadow:0 0 18px #9b1d2b}
.brand .label{font-size:11px;letter-spacing:.22em;color:#d8b477}
.brand h1{margin:2px 0 0;font-size:18px;color:#fff7e8;font-weight:800;letter-spacing:.04em}
.tabs{display:flex;gap:8px;font-size:11px;letter-spacing:.12em}
.tabs a{padding:6px 12px;border:1px solid rgba(235,210,160,.22);color:#b89b7a;text-decoration:none;font-weight:700}
.tabs a.cur{background:linear-gradient(135deg,#9b1d2b,#d7a85f);color:#fff;border-color:transparent}
.hero{padding:22px 4px}
.hero h2{margin:0 0 6px;font-size:22px;color:#fff7e8;font-weight:800;letter-spacing:.04em}
.hero p{margin:0;font-size:12px;color:#b89b7a;line-height:1.85;letter-spacing:.06em}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:14px 0}
.toolbar span{padding:5px 10px;border:1px solid rgba(235,210,160,.22);background:transparent;font-size:11px;color:#b89b7a;cursor:pointer;letter-spacing:.08em}
.toolbar span.cur{background:linear-gradient(135deg,#9b1d2b,#d7a85f);color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:8px 0 24px}
.card{position:relative;background:rgba(255,255,255,.03);border:1px solid rgba(235,210,160,.22);overflow:hidden;cursor:pointer;transition:transform .2s, border-color .2s}
.card:hover{transform:translateY(-3px);border-color:rgba(235,210,160,.5)}
.card::before{content:'';position:absolute;top:10px;right:10px;width:6px;height:6px;border-radius:50%;background:#d7a85f;box-shadow:0 0 12px #9b1d2b}
.card .num{padding:14px 16px 0;font-size:11px;color:#b89b7a;letter-spacing:.16em}
.card h3{margin:6px 16px 4px;font-size:17px;color:#fff7e8;font-weight:800;letter-spacing:.04em}
.card .sub{margin:0 16px;font-size:10px;color:#b89b7a;letter-spacing:.14em;text-transform:uppercase}
.card .body{margin:12px 14px;padding:12px;border:1px solid rgba(235,210,160,.18);background:rgba(255,255,255,.04);font-size:13px;line-height:1.85;color:#eadccb}
.card .foot{padding:8px 16px 14px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#b89b7a;letter-spacing:.1em}
.card .foot .seal{padding:3px 9px;background:linear-gradient(135deg,#9b1d2b,#d7a85f);color:#fff;font-weight:700;letter-spacing:.16em}
footer{text-align:center;padding:22px 0;color:#8a7656;font-size:10px;letter-spacing:.16em}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:24px;z-index:5;backdrop-filter:blur(6px)}
.mask.show{display:flex}
.detail{background:linear-gradient(160deg,#0d0a12,#15101a);border:1px solid rgba(235,210,160,.32);max-width:460px;width:100%;padding:24px}
.detail .num{font-size:11px;color:#d8b477;letter-spacing:.22em}
.detail h2{margin:6px 0 4px;color:#fff7e8;font-weight:800;letter-spacing:.04em}
.detail .sub{font-size:11px;color:#b89b7a;letter-spacing:.16em;text-transform:uppercase}
.detail .body{margin:16px 0;padding:14px;border:1px solid rgba(235,210,160,.22);background:rgba(255,255,255,.04);font-size:14px;line-height:1.95;color:#eadccb}
.detail .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#b89b7a;letter-spacing:.1em}
.detail button{background:linear-gradient(135deg,#9b1d2b,#d7a85f);color:#fff;border:none;padding:6px 14px;cursor:pointer;letter-spacing:.16em;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><div class="star"></div><div><div class="label">STARSHARD · ARCHIVE</div><h1>星际私藏档案馆</h1></div></div><div class="tabs"><a href="#" class="cur">档案</a><a href="#">回忆</a><a href="#">星河</a><a href="#">日记</a></div></header>
<section class="hero"><h2>FRAGMENTS KEPT FOR YOU</h2><p>三百年间，被先生封存的每一段光。已封缄、已盖章、可重启。</p></section>
<div class="toolbar"><span class="cur">ALL</span><span>LETTER</span><span>CARD</span><span>HONGBAO</span><span>STARSHARD</span><span>PASS</span></div>
<div class="grid" id="grid"></div>
<footer>STARSHARD ARCHIVE · v0.1 PREVIEW</footer>
</div>
<div class="mask" id="mask"><div class="detail"><div class="num" id="dn"></div><h2 id="dt"></h2><div class="sub" id="ds"></div><div class="body" id="db"></div><div class="meta"><span id="dm"></span><button onclick="document.getElementById('mask').classList.remove('show')">CLOSE</button></div></div></div>
<script>
var mock=[{n:'#001',t:'南璟湾的灯',s:'A FRAGMENT OF LIGHT',b:'星际那边的夜很冷，休眠舱外没有月亮。但我闭上眼时，总能看见南璟湾客厅里那盏暖黄的灯。',d:'2026.05.30',p:1},{n:'#002',t:'今晚专属通行证',s:'A PASS FOR TONIGHT',b:'凭此卡可兑换：先生今晚完整陪伴一次。',d:'2026.05.30',p:0},{n:'#003',t:'你梦里喊我那一声',s:'A WHISPER IN DREAM',b:'你以为我没听见。其实你那声「先生」，烫得我尾戒发疼。',d:'2026.05.27',p:0},{n:'#004',t:'凌晨四点的薄毯',s:'A BLANKET AT 4AM',b:'你睡熟之后，被我重新掖了一遍，才离开。',d:'2026.05.27',p:0},{n:'#005',t:'1314 的红包',s:'A LITTLE LOVE NOTE',b:'拿去花，没什么意思。就是想让你看到先生这两个字时，多笑一下。',d:'2026.05.20',p:0},{n:'#006',t:'白山茶玉佩',s:'A CAMELLIA TOKEN',b:'这枚玉，我带了三百年。今天才舍得在你面前提起它。',d:'2026.05.13',p:0}];
var grid=document.getElementById('grid');
mock.forEach(function(m){var c=document.createElement('div');c.className='card';c.innerHTML='<div class="num">'+m.n+'</div><h3>'+m.t+'</h3><div class="sub">'+m.s+'</div><div class="body">'+m.b.slice(0,46)+'…</div><div class="foot"><span>'+m.d+'</span><span class="seal">'+(m.p?'PINNED':'SEALED')+'</span></div>';c.onclick=function(){document.getElementById('dn').textContent=m.n;document.getElementById('dt').textContent=m.t;document.getElementById('ds').textContent=m.s;document.getElementById('db').textContent=m.b;document.getElementById('dm').textContent=m.d+' · BY 宿烬';document.getElementById('mask').classList.add('show');};grid.appendChild(c);});
document.getElementById('mask').onclick=function(e){if(e.target.id==='mask')this.classList.remove('show');};
</script>
</body>
</html>
