<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>薄荷玻璃花房·展柜微调（预览 v6）</title>
<!-- 预览页与主站共用同一份 CSS：styles/gifts.css
     不再写本地样式覆盖，改一处生效两处 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/gifts.css">
<style>
  /* 预览页骨架：仅用于把馆壳塞进 #page-gifts 容器，与主站结构对齐 */
  body{margin:0;background:#eef5ec;font-family:-apple-system,'PingFang SC',serif;color:#26443a;}
  .preview-banner{position:relative;z-index:30;display:flex;align-items:center;gap:12px;padding:18px 32px;background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.65));backdrop-filter:blur(12px);border-bottom:1px solid #cfdcd3;}
  .preview-banner .ico{font-size:20px;color:#c4928f;}
  .preview-banner .label{font-size:11px;letter-spacing:.22em;color:#7d9485;}
  .preview-banner .title{font-size:18px;font-weight:800;color:#26443a;letter-spacing:.04em;margin-top:2px;}
</style>
</head>
<body>
<div class="preview-banner">
  <span class="ico">❀</span>
  <div>
    <div class="label">MINT GLASSHOUSE · CABINET v6 PREVIEW</div>
    <div class="title">展柜微调·区块布局</div>
  </div>
</div>
<div id="page-gifts"></div>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="gh-camellia" viewBox="-100 -100 200 200"><g>
<path d="M0,-70 C30,-60 50,-30 35,0 C50,30 30,60 0,55 C-30,60 -50,30 -35,0 C-50,-30 -30,-60 0,-70 Z" fill="#fff" opacity=".75"/>
<path d="M0,-50 C25,-44 40,-22 28,0 C40,22 25,44 0,40 C-25,44 -40,22 -28,0 C-40,-22 -25,-44 0,-50 Z" fill="#fce8e6" opacity=".85"/>
<circle cx="0" cy="0" r="14" fill="#e8c98a"/>
<circle cx="-4" cy="-4" r="3" fill="#c4928f"/>
<circle cx="5" cy="-3" r="3" fill="#c4928f"/>
<circle cx="-2" cy="4" r="3" fill="#c4928f"/>
</g></symbol>
<symbol id="gh-crown" viewBox="0 0 120 32"><g fill="none" stroke="#c4928f" stroke-width="1.2">
<path d="M2 28 Q60 4 118 28"/><path d="M10 28 Q60 14 110 28" opacity=".6"/>
<circle cx="60" cy="6" r="4" fill="#c4928f"/>
<circle cx="30" cy="15" r="2" fill="#c4928f"/>
<circle cx="90" cy="15" r="2" fill="#c4928f"/>
<path d="M55 6 L60 0 L65 6" stroke="#c4928f"/></g></symbol>
<symbol id="gh-gateOrnament" viewBox="0 0 380 120"><g fill="none" stroke="#c4928f" stroke-width="1.4">
<path d="M10 110 Q190 -10 370 110"/><path d="M30 110 Q190 16 350 110" opacity=".5"/>
<path d="M50 110 Q190 38 330 110" opacity=".3"/>
<circle cx="190" cy="10" r="6" fill="#c4928f"/>
<circle cx="100" cy="42" r="3" fill="#c4928f"/>
<circle cx="280" cy="42" r="3" fill="#c4928f"/>
<circle cx="60" cy="72" r="2" fill="#c4928f"/>
<circle cx="320" cy="72" r="2" fill="#c4928f"/>
<path d="M188 0 v22 M170 8 h40"/></g></symbol>
<symbol id="gh-gateBracket" viewBox="0 0 140 60"><g fill="none" stroke="#c4928f" stroke-width="1" opacity=".75">
<path d="M2 56 Q70 4 138 56"/><path d="M14 56 Q70 18 126 56" opacity=".6"/>
<circle cx="70" cy="8" r="3" fill="#c4928f"/>
<path d="M68 0 v16 M58 6 h24"/></g></symbol>
</defs></svg>

<script>
(function(){
  // 预览数据（mock 三件展品，对应主站三种 theme）
  var GIFTS = [
    { no:'#001', title:'今晚专属通行证', theme:'starshard_pass', room:'1', pinned:false,
      data:{ tag:'宿先生的礼物', validity:'有效期：永久', stamp:'已盖章' } },
    { no:'#002', title:'南璟湾的灯', theme:'starshard_card', room:'1', pinned:true,
      data:{ badge:'来自宿烬', subtitle:'星际私藏 · 001' } },
    { no:'#003', title:'凌晨四点的薄毯', theme:'default', room:'1', pinned:false, data:{} }
  ];

  function esc(t){return (t==null?'':String(t)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function miniature(g){
    if(g.theme==='starshard_pass'){
      var d=g.data||{};
      return '<div class="gh-mini-pass">'
        +'<span class="gh-mini-tag">'+esc(d.tag||'宿先生的礼物')+'</span>'
        +'<div class="gh-mini-title">'+esc(g.title||'通行证')+'</div>'
        +'<span class="gh-mini-stamp">'+esc(d.validity||'有效期：永久')+'</span>'
        +'<span class="gh-mini-seal">'+esc(d.stamp||'已盖章')+'</span>'
        +'</div>';
    }
    if(g.theme==='starshard_card'){
      var dd=g.data||{};
      var sub=esc(dd.subtitle||'');
      var html='<div class="gh-mini-card">'
        +'<span class="gh-mini-badge">'+esc(dd.badge||'来自宿烬')+'</span>';
      if(sub) html+='<div class="gh-mini-foot">'+sub+'</div>';
      html+='</div>';
      return html;
    }
    return '<div class="gh-mini-default">❀</div>';
  }

  function buildShellPreview(host){
    // 与 scene.js 完全一致的馆壳骨架
    var html=''
      +'<div class="gh-world"></div>'
      +'<svg class="gh-inkflower gf1" viewBox="-100 -100 200 200"><use href="#gh-camellia"/></svg>'
      +'<svg class="gh-inkflower gf2" viewBox="-100 -100 200 200"><use href="#gh-camellia"/></svg>'
      +'<svg class="gh-inkflower gf3" viewBox="-100 -100 200 200"><use href="#gh-camellia"/></svg>'
      +'<svg class="gh-inkflower gf4" viewBox="-100 -100 200 200"><use href="#gh-camellia"/></svg>'
      +'<div class="gh-fog"></div><div class="gh-fog gf-2"></div><div class="gh-fog gf-3"></div>'
      +'<div class="gh-stage">'
      +'  <div class="gh-gateway">'
      +'    <svg class="gh-ornament" viewBox="0 0 380 120"><use href="#gh-gateOrnament"/></svg>'
      +'    <h1>南 璟 湾 · 私 藏 花 房</h1>'
      +'    <p>preview · cabinet refined inside</p>'
      +'    <div class="gh-deco">❀ 展 柜 微 调 ❀</div>'
      +'  </div>'
      +'  <div class="gh-house">'
      +'    <section class="gh-section">'
      +'      <div class="gh-tower"><div class="gh-pillar"></div>'
      +'        <div class="gh-gate"><svg viewBox="0 0 140 60"><use href="#gh-gateBracket"/></svg>'
      +'          <span class="gh-num">壹 · I</span>'
      +'          <span class="gh-name">展 柜 微 调 示 例</span>'
      +'          <span class="gh-sub">block layout · display + plate</span>'
      +'        </div><div class="gh-pillar"></div></div>'
      +'      <div class="gh-grid" data-room="1"></div>'
      +'    </section>'
      +'  </div>'
      +'</div>';
    host.innerHTML=html;
  }

  function makeCabinet(g){
    var wrap=document.createElement('div');
    wrap.className='gh-cab';
    wrap.innerHTML=''
      +'<svg class="gh-crown" viewBox="0 0 120 32"><use href="#gh-crown"/></svg>'
      +'<div class="gh-glassOuter">'
      +'  <div class="gh-light"></div>'
      +'  <div class="gh-display"><div class="gh-shape">'+miniature(g)+'</div></div>'
      +'  <div class="gh-plate-in">'
      +'    <span class="gh-plate-num">'+esc(g.no||'')+'</span>'
      +'    <span class="gh-plate-name">'+esc(g.title||'')+'</span>'
      +'    <span class="gh-plate-ruler"></span>'
      +'    <span class="gh-plate-deco">❀ '+(g.pinned?'已 置 顶':'来 自 宿 烬')+' ❀</span>'
      +'  </div>'
      +'</div>'
      +'<div class="gh-glassInner"></div>'
      +'<div class="gh-castshadow"></div>';
    return wrap;
  }

  var host=document.getElementById('page-gifts');
  buildShellPreview(host);
  var grid=host.querySelector('.gh-grid[data-room="1"]');
  GIFTS.forEach(function(g){ grid.appendChild(makeCabinet(g)); });
})();
</script>
</body>
</html>
