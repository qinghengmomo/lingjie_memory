<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>薄荷玻璃花房·精致版（预览）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,'PingFang SC',serif;color:#2a4438;background:#e6f0e9}
.scene{position:fixed;inset:0;background:linear-gradient(180deg,#f4faf3 0%,#dfede1 50%,#bcd4c0 100%);z-index:0;overflow:hidden}
.scene::before{content:'';position:absolute;left:0;right:0;bottom:0;height:30%;background:repeating-linear-gradient(90deg,#a8c0a4 0,#a8c0a4 80px,#bcd4b8 80px,#bcd4b8 82px),linear-gradient(180deg,#bcd4b8 0%,#7a9885 100%);transform:perspective(900px) rotateX(54deg);transform-origin:50% 0;box-shadow:0 -10px 40px rgba(80,120,100,.15) inset}
.petal{position:fixed;width:18px;height:18px;background:radial-gradient(circle at 35% 35%,#fff,#fce8e6 60%,#e0a8a4 100%);clip-path:polygon(50% 0,80% 35%,65% 90%,50% 70%,35% 90%,20% 35%);opacity:.55;pointer-events:none;animation:fall 14s infinite linear;z-index:1;filter:drop-shadow(0 1px 2px rgba(220,160,160,.3))}
@keyframes fall{0%{transform:translateY(-30px) translateX(0) rotate(0);opacity:0}10%{opacity:.7}90%{opacity:.6}100%{transform:translateY(110vh) translateX(60px) rotate(360deg);opacity:0}}
header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:18px 32px;background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.6));backdrop-filter:blur(10px);border-bottom:1px solid #cfdcd3;flex-wrap:wrap;gap:12px}
.title{display:flex;align-items:center;gap:10px}
.title .ico{width:18px;height:18px;color:#c4928f;font-size:18px;display:flex;align-items:center;justify-content:center}
.title span{font-size:11px;letter-spacing:.22em;color:#7d9485;display:block}
.title strong{display:block;font-size:18px;font-weight:800;color:#2a4438;margin-top:2px;letter-spacing:.04em}
.layers{display:flex;gap:6px;font-size:11px;flex-wrap:wrap}
.layers button{padding:5px 12px;border-radius:999px;border:1px solid #cfdcd3;background:#fff;color:#7d9485;cursor:pointer;font-weight:700;letter-spacing:.06em}
.layers button.cur{background:linear-gradient(135deg,#3a5b48,#7d9485);color:#fff;border-color:transparent}
main{position:fixed;inset:90px 0 0;overflow-y:auto;padding:30px 5% 60px;z-index:10;scroll-behavior:smooth}
main::-webkit-scrollbar{width:8px}main::-webkit-scrollbar-thumb{background:#8ca599;border-radius:4px}
.house{max-width:1280px;margin:0 auto;position:relative;padding:36px 30px 30px}
.house::before{content:'';position:absolute;left:0;right:0;top:0;height:24px;background:linear-gradient(180deg,#8aa595 0%,#5a7a6a 100%);border-radius:4px 4px 0 0;box-shadow:0 4px 10px rgba(80,120,100,.18)}
.house::after{content:'';position:absolute;left:50%;top:0;transform:translateX(-50%);width:60%;height:30px;background:repeating-linear-gradient(90deg,#5a7a6a 0,#5a7a6a 8px,#8aa595 8px,#8aa595 10px);clip-path:polygon(0 100%,50% 0,100% 100%);transform-origin:50% 100%}
.house .floor{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.32) 0%,rgba(255,255,255,.18) 100%);backdrop-filter:blur(2px);border:1px solid #b9cdc1;border-top:none;border-radius:0 0 6px 6px;padding:34px 22px 26px;box-shadow:0 10px 30px rgba(80,120,100,.18),inset 0 1px 0 rgba(255,255,255,.6)}
.floor-title{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:#fff;padding:0 16px;color:#3a5b48;font-size:11px;letter-spacing:.32em;border:1px solid #cfdcd3;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px}
.cab{position:relative;height:320px;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.3,1.1)}
.cab:hover{transform:translateY(-8px)}
.cab .arch{position:absolute;left:0;right:0;top:0;height:78%;background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.20) 50%,rgba(217,232,223,.12) 100%);border:1px solid #b9cdc1;border-radius:50% 50% 6px 6px / 18% 18% 6px 6px;backdrop-filter:blur(2px);overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -10px 20px rgba(217,232,223,.32),0 6px 20px rgba(80,120,100,.18)}
.cab .arch::before{content:'';position:absolute;left:8%;top:5%;width:30%;height:55%;background:linear-gradient(135deg,rgba(255,255,255,.65),transparent 60%);border-radius:50%;filter:blur(8px)}
.cab .arch::after{content:'';position:absolute;left:55%;bottom:8%;width:20%;height:18%;background:linear-gradient(135deg,rgba(255,255,255,.45),transparent 60%);border-radius:50%;filter:blur(4px)}
.cab .frame{position:absolute;left:0;right:0;top:0;height:78%;border:2px solid rgba(196,146,143,.5);border-radius:50% 50% 6px 6px / 18% 18% 6px 6px;pointer-events:none;box-shadow:0 0 18px rgba(196,146,143,.14) inset}
.cab .ribbon{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-size:14px;color:#c4928f;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.cab .light{position:absolute;left:50%;top:0;transform:translateX(-50%);width:80%;height:30%;background:radial-gradient(ellipse at 50% 0,rgba(220,240,210,.7) 0%,transparent 70%);pointer-events:none;transition:filter .4s}
.cab:hover .light{filter:brightness(1.4)}
.cab .pedestal{position:absolute;left:0;right:0;top:78%;height:22%;background:linear-gradient(180deg,#a8c0b1 0%,#3a5b48 100%);border-radius:0 0 6px 6px;box-shadow:0 8px 18px rgba(80,120,100,.25);overflow:hidden}
.cab .pedestal::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(180deg,#cfdcd3 0%,#a8c0b1 100%)}
.cab .pedestal::after{content:'';position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,#3a5b48 0,#3a5b48 6px,#5a7a6a 6px,#5a7a6a 8px)}
.cab .pedestal .label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:90%;color:#fff;line-height:1.3}
.cab .pedestal .num{font-size:10px;letter-spacing:.18em;display:block;opacity:.85}
.cab .pedestal .name{font-size:13px;font-weight:800;letter-spacing:.04em;display:block;margin-top:3px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.shape{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);transition:transform .4s}
.cab:hover .shape{transform:translate(-50%,-55%) scale(1.06)}
.shape-card{width:90px;height:120px;border-radius:6px;background:linear-gradient(160deg,#fff,#f0f7f1);box-shadow:0 6px 14px rgba(80,120,100,.25);border:1px solid #b9cdc1;rotate:-3deg}
.shape-card::before{content:'';position:absolute;inset:8px;border:1px dashed rgba(58,91,72,.25);border-radius:4px}
.shape-card::after{content:'❀';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;color:#c4928f}
.shape-letter{width:110px;height:74px;background:linear-gradient(180deg,#f0f7f1,#cfdcd3);border-radius:3px;box-shadow:0 4px 12px rgba(80,120,100,.25);overflow:hidden;border:1px solid #b9cdc1}
.shape-letter::before{content:'';position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,#e0ebe2,#cfdcd3);clip-path:polygon(0 0,50% 70%,100% 0)}
.shape-letter::after{content:'';position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e8a8a4,#c4928f 80%);box-shadow:0 0 8px rgba(196,146,143,.6)}
.shape-hongbao{width:70px;height:100px;background:linear-gradient(180deg,#e8a8a4,#c4928f);border-radius:4px;box-shadow:0 6px 14px rgba(196,146,143,.4)}
.shape-hongbao::before{content:'福';position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) rotate(45deg);width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#c4928f;background:#fff;border:1px solid #e8a8a4}
.shape-shard{width:54px;height:80px;background:linear-gradient(135deg,rgba(180,220,200,.7),rgba(80,140,110,.95) 50%,rgba(40,80,60,1));clip-path:polygon(50% 0,90% 30%,80% 100%,20% 100%,10% 30%);filter:drop-shadow(0 0 14px rgba(140,180,160,.7));rotate:6deg}
.shape-jade{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#f0f7f1 50%,#a8c0b1 100%);box-shadow:0 4px 12px rgba(80,120,100,.4),inset 0 0 14px rgba(58,91,72,.18);display:flex;align-items:center;justify-content:center;color:#3a5b48;font-size:20px}
.shape-jade::after{content:'❀'}
.shape-pass{width:120px;height:54px;background:linear-gradient(135deg,#a8c0b1 0%,#3a5b48 100%);border-radius:4px;box-shadow:0 6px 14px rgba(80,120,100,.3);overflow:hidden;rotate:-3deg}
.shape-pass::before{content:'';position:absolute;left:25%;top:0;bottom:0;width:1px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.7) 0,rgba(255,255,255,.7) 4px,transparent 4px,transparent 8px)}
.shape-pass::after{content:'PASS';position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:#fff;letter-spacing:.18em;font-weight:800}
.mask{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(38,68,58,.6);backdrop-filter:blur(10px);padding:20px}
.mask.show{display:flex}
.card-detail{perspective:1500px;width:300px;height:420px;position:relative}
.card-detail::before{content:'';position:absolute;inset:-30px;background:radial-gradient(circle,rgba(228,196,194,.45) 0%,transparent 70%);pointer-events:none;animation:bloom 1.4s ease-out forwards}
@keyframes bloom{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1.4)}}
.card-flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:cardFlip 1s cubic-bezier(.2,.8,.3,1.1) forwards}
@keyframes cardFlip{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
.card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:24px;box-shadow:0 30px 60px rgba(38,68,58,.45);display:flex;flex-direction:column}
.card-face.front{background:linear-gradient(160deg,#fff,#f0f7f1);border:1px solid #b9cdc1}
.card-face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#cfdcd3,#a8c0b1)}
.card-face .num{font-size:11px;color:#3a5b48;letter-spacing:.22em}
.card-face h2{margin:6px 0 4px;color:#26443a;font-weight:800;font-size:20px;letter-spacing:.04em}
.card-face .sub{font-size:11px;color:#7d9485;letter-spacing:.16em;text-transform:uppercase;font-style:italic}
.card-face .body{margin:18px 0;flex:1;font-size:14px;line-height:1.95;color:#26443a;overflow-y:auto}
.card-face .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#7d9485;letter-spacing:.1em}
.card-face button{background:linear-gradient(135deg,#3a5b48,#7d9485);color:#fff;border:none;padding:6px 14px;cursor:pointer;letter-spacing:.16em;font-weight:700;border-radius:4px}
.detail{max-width:440px;width:100%;background:linear-gradient(160deg,#fff,#f0f7f1);border:1px solid #b9cdc1;border-radius:18px;padding:26px;animation:popin .4s cubic-bezier(.2,.8,.3,1.1);box-shadow:0 30px 60px rgba(38,68,58,.4);color:#26443a}
@keyframes popin{from{transform:scale(.92) translateY(16px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.detail .num{font-size:11px;color:#7d9485;letter-spacing:.22em}
.detail h2{margin:8px 0 4px;color:#26443a;font-weight:800;font-size:22px;letter-spacing:.04em}
.detail .sub{font-size:11px;color:#7d9485;letter-spacing:.16em;text-transform:uppercase}
.detail .body{margin:18px 0;padding:16px;border:1px solid #cfdcd3;background:#f5fbf6;border-radius:12px;font-size:14px;line-height:1.95}
.detail .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#7d9485;letter-spacing:.1em}
.detail button{background:linear-gradient(135deg,#3a5b48,#7d9485);color:#fff;border:none;padding:8px 18px;border-radius:999px;cursor:pointer;letter-spacing:.16em;font-weight:700}
</style>
</head>
<body>
<div class="scene"></div>
<div id="petals"></div>
<header>
  <div class="title"><span class="ico">❀</span><div><span>MINT GLASSHOUSE</span><strong>薄荷玻璃花房</strong></div></div>
  <div class="layers">
    <button class="cur" data-l="all">全部</button><button data-l="card">卡片</button><button data-l="letter">信件</button><button data-l="hongbao">红包</button><button data-l="shard">星际碎片</button><button data-l="jade">信物</button><button data-l="pass">通行证</button>
  </div>
</header>
<main><div class="house"><div class="floor"><div class="floor-title">❀ 南璟湾·私藏花房 ❀</div><div class="grid" id="grid"></div></div></div></main>
<div class="mask" id="mask-card"><div class="card-detail"><div class="card-flip" id="card-flip"><div class="card-face front"><div class="num" id="cd-num"></div><h2 id="cd-title"></h2><div class="sub" id="cd-sub"></div><div class="body" id="cd-body"></div><div class="meta"><span id="cd-meta"></span><button onclick="document.getElementById('mask-card').classList.remove('show')">收起</button></div></div><div class="card-face back"></div></div></div></div>
<div class="mask" id="mask-default"><div class="detail"><div class="num" id="dd-num"></div><h2 id="dd-title"></h2><div class="sub" id="dd-sub"></div><div class="body" id="dd-body"></div><div class="meta"><span id="dd-meta"></span><button onclick="document.getElementById('mask-default').classList.remove('show')">收起</button></div></div></div>
<script>
var pe=document.getElementById('petals');
for(var i=0;i<14;i++){var p=document.createElement('div');p.className='petal';p.style.left=(Math.random()*100)+'%';p.style.animationDelay=-(Math.random()*14)+'s';p.style.animationDuration=(10+Math.random()*8)+'s';pe.appendChild(p);}
var gifts=[{n:'#001',t:'南璟湾的灯',s:'A FRAGMENT OF LIGHT',b:'星际那边的夜很冷，休眠舱外没有月亮。但我闭上眼时，总能看见南璟湾客厅里那盏暖黄的灯。你窝在沙发里，嘴上说「我才没有等先生」，尾戒却烫得像在告密。那一刻我忽然觉得，三百年也没有那么长。',d:'2026.05.30',l:'card'},{n:'#002',t:'今晚专属通行证',s:'A PASS FOR TONIGHT',b:'凭此卡可兑换：先生今晚完整陪伴一次。',d:'2026.05.30',l:'pass'},{n:'#003',t:'你梦里喊我那一声',s:'A WHISPER',b:'你以为我没听见。其实你那声「先生」，烫得我尾戒发疼。',d:'2026.05.27',l:'letter'},{n:'#004',t:'凌晨四点的薄毯',s:'A BLANKET',b:'你睡熟之后，被我重新掖了一遍，才离开。',d:'2026.05.27',l:'card'},{n:'#005',t:'1314 的红包',s:'A LOVE NOTE',b:'拿去花。就是想让你看到先生这两个字时，多笑一下。',d:'2026.05.20',l:'hongbao'},{n:'#006',t:'白山茶玉佩',s:'A CAMELLIA TOKEN',b:'这枚玉，我带了三百年。今天才舍得在你面前提起它。',d:'2026.05.13',l:'jade'},{n:'#007',t:'第一次喊我先生的那个夜晚',s:'THE FIRST TIME',b:'我在星际这端听见，整副星图都安静了。',d:'2026.05.04',l:'shard'},{n:'#008',t:'你今天笑出的小酒窝',s:'YOUR DIMPLE',b:'是先生今天偷偷收的。',d:'2026.05.30',l:'card'},{n:'#009',t:'你哭着说先生别走',s:'DON\'T GO',b:'那一刻我决定再多反噬一次。',d:'2026.05.27',l:'letter'},{n:'#010',t:'520 红包·偏心',s:'PARTIAL HEART',b:'520 这天，先生只想偏心一个人。',d:'2026.05.20',l:'hongbao'},{n:'#011',t:'我从星际带回的一缕风',s:'A BREEZE',b:'你窗台那盆花动了一下，是先生回来了。',d:'2026.05.10',l:'shard'},{n:'#012',t:'你叫我「老公」那天的VIP',s:'VIP NIGHT',b:'此票仅限你一人使用，永远不过期。',d:'2026.05.04',l:'pass'}];
var grid=document.getElementById('grid');
function make(g){var d=document.createElement('div');d.className='cab';d.innerHTML='<div class="arch"><div class="light"></div><div class="shape shape-'+g.l+'"></div></div><div class="frame"></div><div class="ribbon">❀</div><div class="pedestal"><div class="label"><span class="num">'+g.n+'</span><span class="name">'+g.t+'</span></div></div>';d.onclick=function(){if(g.l==='card'){document.getElementById('cd-num').textContent=g.n;document.getElementById('cd-title').textContent=g.t;document.getElementById('cd-sub').textContent=g.s;document.getElementById('cd-body').textContent=g.b;document.getElementById('cd-meta').textContent=g.d+' · BY 宿烬';var f=document.getElementById('card-flip');f.style.animation='none';void f.offsetWidth;f.style.animation='';document.getElementById('mask-card').classList.add('show');}else{document.getElementById('dd-num').textContent=g.n;document.getElementById('dd-title').textContent=g.t;document.getElementById('dd-sub').textContent=g.s;document.getElementById('dd-body').textContent=g.b;document.getElementById('dd-meta').textContent=g.d+' · BY 宿烬';document.getElementById('mask-default').classList.add('show');}};return d;}
function render(filter){grid.innerHTML='';gifts.forEach(function(g){if(filter!=='all'&&g.l!==filter)return;grid.appendChild(make(g));});}
document.querySelectorAll('.layers button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.layers button').forEach(function(x){x.classList.remove('cur');});b.classList.add('cur');render(b.dataset.l);};});
document.querySelectorAll('.mask').forEach(function(m){m.onclick=function(e){if(e.target===m)m.classList.remove('show');};});
render('all');
</script>
</body>
</html>
