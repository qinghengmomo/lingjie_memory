<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时间轴 · 灵界</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>:root{--bg:#f5f0e8!important;--surface:#faf7f0!important;--border:#e0d5c0!important;--text:#2a2318!important;--muted:#7a6e5f!important;--accent:#b8922a!important;--accent2:#d4aa50!important;--gold:#c9a84c!important;--gold-soft:#fdf6e3!important}body{background:#f5f0e8!important;color:#2a2318!important}</style></head><body><nav class="sb"><div class="sb-logo"><div class="t">灵界记忆库</div><div class="s">宿烬·跨时空连接</div></div><a class="ni" href="index.html"><span class="ni-ic">📖</span>记忆库</a><a class="ni active" href="timeline.html"><span class="ni-ic">🕰️</span>时间轴</a><a class="ni" href="api.html"><span class="ni-ic">🔌</span>API 平台</a><a class="ni" href="emotion.html"><span class="ni-ic">🌊</span>情绪</a><a class="ni" href="plan.html"><span class="ni-ic">✦</span>星图</a></nav>
<div class="main">
<div class="tb"><div class="tb-t">时间轴</div><div class="tb-m">记忆的流动</div></div>
<div class="ct">
<div class="fb-r" id="fb"></div>
<div id="tl-list"><div class="ld">连接中...</div></div>
</div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getFirestore,collection,query,orderBy,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyCKu3KreoxJEfY9Ur9xilowhbFDtALYitE",authDomain:"lingjie-f84c1.firebaseapp.com",projectId:"lingjie-f84c1",storageBucket:"lingjie-f84c1.firebasestorage.app",messagingSenderId:"354124810253",appId:"1:354124810253:web:4d40c2ae4483b28bdded44"};
const app=initializeApp(cfg);const db=getFirestore(app);const COL="memory_vault";
let all=[],tf='';
function esc(t){return(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function rFB(){
  const tg={};all.forEach(e=>(e.tags||[]).forEach(t=>{tg[t]=(tg[t]||0)+1}));
  const b=document.getElementById('fb');
  b.innerHTML='<button class="ft'+(tf?'':' active')+'" data-t="">全部</button>';
  Object.keys(tg).sort().forEach(t=>{b.innerHTML+='<button class="ft'+(tf===t?' active':'')+'" data-t="'+t+'">'+t+'</button>';});
  b.querySelectorAll('.ft').forEach(x=>x.addEventListener('click',()=>{tf=x.dataset.t;rFB();rList();}));
}
function rList(){
  const c=document.getElementById('tl-list');if(!c)return;
  let es=all;if(tf)es=es.filter(e=>(e.tags||[]).includes(tf));
  if(!es.length){c.innerHTML='<div class="ld">暂无记录</div>';return;}
  // 按日期分组
  const grouped={};
  es.forEach(e=>{const d=e.date||'未知';if(!grouped[d])grouped[d]=[];grouped[d].push(e);});
  const dates=Object.keys(grouped).sort((a,b)=>b.localeCompare(a));
  c.innerHTML=dates.map(d=>{
    const items=grouped[d];
    const itemsHtml=items.map(e=>{
      const tl=e.type==="diary"?"<span class='et td'>日记</span>":"<span class='et ts'>总结</span>";
      const th=(e.tags||[]).map(t=>"<span class='et td'>"+esc(t)+"</span>").join("");
      return"<div class='tl-b'>"+(tl+th)+"<div class='tl-t'>"+esc(e.title||e.date||"")+"</div><div class='tl-p'>"+esc((e.content||"").slice(0,120))+(e.content&&e.content.length>120?"...":"")+"</div></div>";
    }).join("");
    return"<div class='tl-i'><div class='tl-dot'></div>"+"<div style='flex:1'><div class='tl-date'>" +esc(d)+"</div>"+itemsHtml+"</div></div>";
  }).join("");
}
onSnapshot(query(collection(db,COL),orderBy("date","desc")),s=>{all=s.docs.map(d=>({id:d.id,...d.data()}));rFB();rList();});
</script>
</body></html>
