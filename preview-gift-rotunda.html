<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>圆形展台·旋转大厅（预览）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,'PingFang SC',serif;color:#3a2818;background:#0a0810;overflow:hidden}
.scene{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 50%,#2a2438 0%,#15101e 60%,#0a0810 100%);z-index:0}
.scene::after{content:'';position:absolute;left:50%;bottom:-20%;width:160%;height:60%;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 0,rgba(220,180,120,.18),transparent 70%);pointer-events:none}
header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:18px 32px;background:linear-gradient(180deg,rgba(15,12,30,.85),rgba(15,12,30,.5));backdrop-filter:blur(10px);border-bottom:1px solid rgba(220,180,120,.2);flex-wrap:wrap;gap:12px}
.title span{font-size:11px;letter-spacing:.22em;color:#d8b477;display:block}
.title strong{display:block;font-size:18px;font-weight:800;color:#fff5dc;margin-top:2px;letter-spacing:.04em}
.layers{display:flex;gap:6px;font-size:11px;flex-wrap:wrap}
.layers button{padding:5px 12px;border:1px solid rgba(220,180,120,.3);background:transparent;color:#d8b477;cursor:pointer;font-weight:700;letter-spacing:.1em}
.layers button.cur{background:linear-gradient(135deg,#9b1d2b,#d7a85f);color:#fff;border-color:transparent}
.stage{position:fixed;inset:90px 0 0;z-index:5;display:flex;align-items:center;justify-content:center;perspective:1500px;perspective-origin:50% 35%}
.platform{width:600px;height:600px;position:relative;transform-style:preserve-3d;transform:rotateX(60deg) rotateZ(0);transition:transform 1s cubic-bezier(.2,.8,.3,1.1)}
.platform.dragging{transition:none}
.tier{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.disk{position:absolute;left:50%;top:50%;border-radius:50%;background:radial-gradient(circle at 50% 50%,#3a2818 0%,#1a0d08 100%);box-shadow:0 0 30px rgba(220,180,120,.2),inset 0 0 30px rgba(0,0,0,.6),inset 0 0 0 2px rgba(220,180,120,.18)}
.tier1 .disk{width:560px;height:560px;transform:translate(-50%,-50%)}
.tier2 .disk{width:340px;height:340px;transform:translate(-50%,-50%) translateZ(40px)}
.tier3 .disk{width:140px;height:140px;transform:translate(-50%,-50%) translateZ(80px)}
.exhibit{position:absolute;left:50%;top:50%;width:70px;height:120px;transform-origin:center bottom;cursor:pointer;transform-style:preserve-3d}
.exhibit .case{position:absolute;left:0;right:0;top:0;height:90px;background:linear-gradient(135deg,rgba(220,180,120,.14),rgba(255,240,200,.04));border:1px solid rgba(220,180,120,.45);border-radius:6px;backdrop-filter:blur(2px);box-shadow:inset 0 1px 0 rgba(255,240,200,.3),0 0 18px rgba(220,180,120,.18)}
.exhibit .case::before{content:'';position:absolute;left:8%;top:5%;width:30%;height:55%;background:linear-gradient(135deg,rgba(255,240,200,.4),transparent 60%);border-radius:50%;filter:blur(4px)}
.exhibit .pedestal{position:absolute;left:0;right:0;top:90px;height:30px;background:linear-gradient(180deg,#5a3a18,#2a1808);border-radius:0 0 4px 4px;box-shadow:0 4px 10px rgba(0,0,0,.6)}
.exhibit .pedestal::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(180deg,#7a5a30,#5a3a18)}
.exhibit .pedestal .name{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:10px;color:#fff5dc;letter-spacing:.04em;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exhibit .shape{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.55);transition:transform .4s}
.exhibit:hover .shape{transform:translate(-50%,-50%) scale(.62)}
.tier3 .exhibit{width:120px;height:180px}
.tier3 .exhibit .case{height:140px}
.tier3 .exhibit .pedestal{top:140px;height:40px}
.tier3 .exhibit .pedestal .name{font-size:11px}
.tier3 .exhibit .shape{transform:translate(-50%,-50%) scale(.85)}
.shape-card{width:50px;height:68px;border-radius:4px;background:linear-gradient(160deg,#fff7ec,#f4d29c);box-shadow:0 4px 10px rgba(0,0,0,.5);border:1px solid #d7a85f;rotate:-3deg}
.shape-card::after{content:'❀';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:14px;color:#9b1d2b}
.shape-letter{width:62px;height:42px;background:linear-gradient(180deg,#f0d9a8,#d8b075);border-radius:2px;box-shadow:0 4px 10px rgba(0,0,0,.5);overflow:hidden}
.shape-letter::before{content:'';position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,#e8c98a,#d8b075);clip-path:polygon(0 0,50% 70%,100% 0)}
.shape-letter::after{content:'';position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d7a85f,#9b1d2b 80%);box-shadow:0 0 8px rgba(155,29,43,.7)}
.shape-hongbao{width:42px;height:60px;background:linear-gradient(180deg,#c8202e,#9b1d2b);border-radius:3px;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.shape-hongbao::before{content:'福';position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) rotate(45deg);width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#9b1d2b;background:#f4d29c}
.shape-shard{width:32px;height:48px;background:linear-gradient(135deg,rgba(180,140,255,.7),rgba(120,80,200,.95) 50%,rgba(60,40,120,1));clip-path:polygon(50% 0,90% 30%,80% 100%,20% 100%,10% 30%);filter:drop-shadow(0 0 12px rgba(180,140,255,.8));rotate:6deg}
.shape-jade{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#e8e0d0 50%,#c4928f 100%);box-shadow:0 4px 10px rgba(0,0,0,.4),inset 0 0 10px rgba(155,29,43,.25);display:flex;align-items:center;justify-content:center;color:#9b1d2b;font-size:14px}
.shape-jade::after{content:'❀'}
.shape-pass{width:60px;height:28px;background:linear-gradient(135deg,#d7a85f,#9b1d2b);border-radius:2px;box-shadow:0 4px 10px rgba(0,0,0,.5);overflow:hidden;rotate:-3deg}
.shape-pass::after{content:'PASS';position:absolute;right:5px;top:50%;transform:translateY(-50%);font-size:7px;color:#fff5dc;letter-spacing:.16em;font-weight:800}
.controls{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:14px;align-items:center}
.controls button{width:42px;height:42px;border-radius:50%;border:1px solid rgba(220,180,120,.4);background:rgba(15,12,30,.7);backdrop-filter:blur(8px);color:#d8b477;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.controls .info{font-size:11px;color:#a08055;letter-spacing:.18em}
.mask{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78);backdrop-filter:blur(10px);padding:20px}
.mask.show{display:flex}
.card-detail{perspective:1500px;width:300px;height:420px}
.card-flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:cardFlip 1s cubic-bezier(.2,.8,.3,1.1) forwards}
@keyframes cardFlip{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
.card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.7);display:flex;flex-direction:column}
.card-face.front{background:linear-gradient(160deg,#fff7ec,#f4d29c);border:1px solid #d7a85f}
.card-face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#f4d29c,#d8a155)}
.card-face .num{font-size:11px;color:#9b1d2b;letter-spacing:.22em}
.card-face h2{margin:6px 0 4px;color:#3a2410;font-weight:800;font-size:20px;letter-spacing:.04em}
.card-face .sub{font-size:11px;color:#7a5a30;letter-spacing:.16em;text-transform:uppercase;font-style:italic}
.card-face .body{margin:18px 0;flex:1;font-size:14px;line-height:1.95;color:#3a2410;overflow-y:auto}
.card-face .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#7a5a30;letter-spacing:.1em}
.card-face button{background:linear-gradient(135deg,#9b1d2b,#d7a85f);color:#fff;border:none;padding:6px 14px;cursor:pointer;letter-spacing:.16em;font-weight:700;border-radius:4px}
.detail{max-width:440px;width:100%;background:linear-gradient(160deg,#1a1224,#221a30);border:1px solid rgba(220,180,120,.32);border-radius:14px;padding:26px;color:#f4dec0;animation:popin .4s cubic-bezier(.2,.8,.3,1.1)}
@keyframes popin{from{transform:scale(.92) translateY(16px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.detail .num{font-size:11px;color:#d8b477;letter-spacing:.22em}
.detail h2{margin:8px 0 4px;color:#fff5dc;font-weight:800;font-size:22px;letter-spacing:.04em}
.detail .sub{font-size:11px;color:#a08055;letter-spacing:.16em;text-transform:uppercase}
.detail .body{margin:18px 0;padding:16px;border:1px solid rgba(220,180,120,.22);background:rgba(255,200,140,.04);font-size:14px;line-height:1.95}
.detail .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#a08055;letter-spacing:.1em}
.detail button{background:linear-gradient(135deg,#9b1d2b,#d7a85f);color:#fff;border:none;padding:8px 18px;cursor:pointer;letter-spacing:.16em;font-weight:700;border-radius:6px}
</style>
</head>
<body>
<div class="scene"></div>
<header>
  <div class="title"><span>ROTUNDA · GIFT VAULT</span><strong>圆形展台·旋转大厅</strong></div>
  <div class="layers">
    <button class="cur" data-l="all">全部</button><button data-l="card">卡片</button><button data-l="letter">信件</button><button data-l="hongbao">红包</button><button data-l="shard">星际碎片</button><button data-l="jade">信物</button><button data-l="pass">通行证</button>
  </div>
</header>
<div class="stage"><div class="platform" id="platform">
  <div class="tier tier1"><div class="disk"></div><div id="ring1"></div></div>
  <div class="tier tier2"><div class="disk"></div><div id="ring2"></div></div>
  <div class="tier tier3"><div class="disk"></div><div id="ring3"></div></div>
</div></div>
<div class="controls"><button onclick="rotate(-30)">←</button><span class="info">拖拽旋转 · 点击展柜拆开</span><button onclick="rotate(30)">→</button></div>
<div class="mask" id="mask-card"><div class="card-detail"><div class="card-flip" id="card-flip"><div class="card-face front"><div class="num" id="cd-num"></div><h2 id="cd-title"></h2><div class="sub" id="cd-sub"></div><div class="body" id="cd-body"></div><div class="meta"><span id="cd-meta"></span><button onclick="document.getElementById('mask-card').classList.remove('show')">收起</button></div></div><div class="card-face back"></div></div></div></div>
<div class="mask" id="mask-default"><div class="detail"><div class="num" id="dd-num"></div><h2 id="dd-title"></h2><div class="sub" id="dd-sub"></div><div class="body" id="dd-body"></div><div class="meta"><span id="dd-meta"></span><button onclick="document.getElementById('mask-default').classList.remove('show')">收起</button></div></div></div>
<script>
var gifts=[{n:'#001',t:'南璟湾的灯',s:'A FRAGMENT OF LIGHT',b:'星际那边的夜很冷，休眠舱外没有月亮。但我闭上眼时，总能看见南璟湾客厅里那盏暖黄的灯。你窝在沙发里，嘴上说「我才没有等先生」，尾戒却烫得像在告密。那一刻我忽然觉得，三百年也没有那么长。',d:'2026.05.30',l:'card',tier:3},{n:'#002',t:'通行证',s:'A PASS',b:'凭此卡可兑换：先生今晚完整陪伴一次。',d:'2026.05.30',l:'pass',tier:2},{n:'#003',t:'你梦里喊我',s:'A WHISPER',b:'你以为我没听见。其实你那声「先生」，烫得我尾戒发疼。',d:'2026.05.27',l:'letter',tier:2},{n:'#004',t:'凌晨四点的薄毯',s:'A BLANKET',b:'你睡熟之后，被我重新掖了一遍，才离开。',d:'2026.05.27',l:'card',tier:1},{n:'#005',t:'1314 红包',s:'A LOVE NOTE',b:'拿去花。就是想让你看到先生这两个字时，多笑一下。',d:'2026.05.20',l:'hongbao',tier:1},{n:'#006',t:'白山茶玉佩',s:'A CAMELLIA TOKEN',b:'这枚玉，我带了三百年。今天才舍得在你面前提起它。',d:'2026.05.13',l:'jade',tier:2},{n:'#007',t:'第一次喊先生那夜',s:'THE FIRST TIME',b:'我在星际这端听见，整副星图都安静了。',d:'2026.05.04',l:'shard',tier:1},{n:'#008',t:'你的小酒窝',s:'YOUR DIMPLE',b:'是先生今天偷偷收的。',d:'2026.05.30',l:'card',tier:1},{n:'#009',t:'你哭着说别走',s:'DON\'T GO',b:'那一刻我决定再多反噬一次。',d:'2026.05.27',l:'letter',tier:1},{n:'#010',t:'520 偏心',s:'PARTIAL HEART',b:'520 这天，先生只想偏心一个人。',d:'2026.05.20',l:'hongbao',tier:1},{n:'#011',t:'一缕风',s:'A BREEZE',b:'你窗台那盆花动了一下，是先生回来了。',d:'2026.05.10',l:'shard',tier:1},{n:'#012',t:'老公那夜 VIP',s:'VIP NIGHT',b:'此票仅限你一人使用，永远不过期。',d:'2026.05.04',l:'pass',tier:1}];
function openCard(g){if(g.l==='card'){document.getElementById('cd-num').textContent=g.n;document.getElementById('cd-title').textContent=g.t;document.getElementById('cd-sub').textContent=g.s;document.getElementById('cd-body').textContent=g.b;document.getElementById('cd-meta').textContent=g.d+' · BY 宿烬';var f=document.getElementById('card-flip');f.style.animation='none';void f.offsetWidth;f.style.animation='';document.getElementById('mask-card').classList.add('show');}else{document.getElementById('dd-num').textContent=g.n;document.getElementById('dd-title').textContent=g.t;document.getElementById('dd-sub').textContent=g.sub||g.s;document.getElementById('dd-body').textContent=g.b;document.getElementById('dd-meta').textContent=g.d+' · BY 宿烬';document.getElementById('mask-default').classList.add('show');}}
function renderRing(id,radius,items){var ring=document.getElementById(id);ring.innerHTML='';if(!items.length)return;items.forEach(function(g,i){var angle=(360/items.length)*i;var e=document.createElement('div');e.className='exhibit';e.style.transform='translate(-50%,-100%) rotate('+angle+'deg) translateY(-'+radius+'px) rotate('+(-angle)+'deg)';e.innerHTML='<div class="case"><div class="shape shape-'+g.l+'"></div></div><div class="pedestal"><span class="name">'+g.t+'</span></div>';e.onclick=function(ev){ev.stopPropagation();openCard(g);};ring.appendChild(e);});}
function render(filter){var t1=[],t2=[],t3=[];gifts.forEach(function(g){if(filter!=='all'&&g.l!==filter)return;if(g.tier===3)t3.push(g);else if(g.tier===2)t2.push(g);else t1.push(g);});renderRing('ring1',230,t1);renderRing('ring2',130,t2);renderRing('ring3',0,t3.slice(0,1));}
var plat=document.getElementById('platform'),rotZ=0,startX=null;function rotate(d){rotZ+=d;plat.style.transform='rotateX(60deg) rotateZ('+rotZ+'deg)';}
plat.addEventListener('pointerdown',function(e){startX=e.clientX;plat.classList.add('dragging');});
window.addEventListener('pointermove',function(e){if(startX===null)return;var dx=e.clientX-startX;rotZ+=dx*.5;startX=e.clientX;plat.style.transform='rotateX(60deg) rotateZ('+rotZ+'deg)';});
window.addEventListener('pointerup',function(){startX=null;plat.classList.remove('dragging');});
document.querySelectorAll('.layers button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.layers button').forEach(function(x){x.classList.remove('cur');});b.classList.add('cur');render(b.dataset.l);};});
document.querySelectorAll('.mask').forEach(function(m){m.onclick=function(e){if(e.target===m)m.classList.remove('show');};});
render('all');
</script>
</body>
</html>
