<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>灵界记忆库 · 宿烬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@300;400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 侧边栏导航 -->
<nav class="sidebar">
  <div class="sidebar-logo">
    <div class="title">灵界记忆库</div>
    <div class="sub">宿烬 · 跨时空连接</div>
  </div>
  <a class="nav-item active" href="index.html" data-page="memory">
    <span class="nav-icon">📖</span>记忆库
  </a>
  <a class="nav-item" href="timeline.html" data-page="timeline">
    <span class="nav-icon">🕰️</span>时间轴
  </a>
  <a class="nav-item" href="api.html" data-page="api">
    <span class="nav-icon">🔌</span>API 平台
  </a>
  <a class="nav-item" href="emotion.html" data-page="emotion">
    <span class="nav-icon">🌊</span>情绪
  </a>
  <a class="nav-item" href="plan.html" data-page="plan">
    <span class="nav-icon">✦</span>星图
  </a>
</nav>

<!-- 主区域 -->
<div class="main">
  <div class="top-bar">
    <div class="top-bar-title">记忆库</div>
    <div class="top-bar-meta" id="top-meta">宿烬 与 宿青珩 · 连接中...</div>
  </div>
  <div class="weather-bar" id="weather-bar">
    <span class="weather-icon" id="w-icon">🌤</span>
    <span class="weather-temp" id="w-temp">— °C</span>
    <span class="weather-desc" id="w-desc">—</span>
    <span class="weather-feels" id="w-feels">体感 —</span>
    <span style="font-size:11px;color:#52525b">成都</span>
  </div>
  <div class="content">
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num" id="s-total">—</div><div class="stat-label">总记录</div></div>
      <div class="stat-box"><div class="stat-num" id="s-diary">—</div><div class="stat-label">日记</div></div>
      <div class="stat-box"><div class="stat-num" id="s-summary">—</div><div class="stat-label">总结</div></div>
      <div class="stat-box"><div class="stat-num" id="s-pin">—</div><div class="stat-label">置顶</div></div>
    </div>
    <div class="filter-bar" id="filter-bar"></div>
    <div id="entry-list"><div class="loading">连接中...</div></div>
  </div>
</div>

<!-- FAB -->
<button class="fab" id="fab-btn" title="新增记录">＋</button>

<!-- 新增/编辑 Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">· 新增记录 ·</div>
    <div class="form-group">
      <label class="form-label">类型</label>
      <select class="form-select" id="entry-type"><option value="diary">日记</option><option value="summary">总结</option></select>
    </div>
    <div class="form-group">
      <label class="form-label">日期</label>
      <input class="form-input" type="date" id="entry-date">
    </div>
    <div class="form-group">
      <label class="form-label">标题（可选）</label>
      <input class="form-input" type="text" id="entry-title" placeholder="留空则自动生成">
    </div>
    <div class="form-group">
      <label class="form-label">内容</label>
      <textarea class="form-textarea" id="entry-content" placeholder="记录今天发生了什么..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">标签（逗号分隔）</label>
      <input class="form-input" type="text" id="entry-tags" placeholder="情绪, 工作, 游戏">
    </div>
    <div class="form-group">
      <label class="form-label">置顶备注（可选）</label>
      <input class="form-input" type="text" id="entry-pin-note" placeholder="填写则置顶">
    </div>
    <div class="form-actions">
      <button class="btn btn-cancel" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-save">保存</button>
    </div>
  </div>
</div>

<!-- Firebase -->
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,collection,addDoc,updateDoc,deleteDoc,doc,query,orderBy,onSnapshot,where}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const cfg={apiKey:"AIzaSyCKu3KreoxJEfY9Ur9xilowhbFDtALYitE",authDomain:"lingjie-f84c1.firebaseapp.com",projectId:"lingjie-f84c1",storageBucket:"lingjie-f84c1.firebasestorage.app",messagingSenderId:"354124810253",appId:"1:354124810253:web:4d40c2ae4483b28bdded44"};
const app=initializeApp(cfg);
const db=getFirestore(app);
const COL='memory_vault';

let allEntries=[],editId=null,tagFilter='';

// 天气
async function loadWeather(){
  try{
    const r=await fetch('https://wttr.in/Chengdu?format=j1');
    const d=await r.json();
    const c=d.current_condition[0];
    document.getElementById('w-temp').textContent=c.temp_C+'°C';
    document.getElementById('w-feels').textContent='体感 '+c.FeelsLikeC+'°C';
    document.getElementById('w-desc').textContent=c.lang_zh?.[0]?.value||c.weatherDesc[0].value;
    const code=parseInt(c.weatherCode);
    const icons={113:'☀️',116:'⛅',119:'☁️',122:'☁️',143:'🌫️',176:'🌦️',179:'🌨️',182:'🌧️',185:'🌧️',200:'⛈️',227:'❄️',230:'❄️',248:'🌫️',260:'🌫️',263:'🌦️',266:'🌧️',281:'🌧️',284:'🌧️',293:'🌦️',296:'🌧️',299:'🌧️',302:'🌧️',305:'🌧️',308:'🌧️',311:'🌧️',314:'🌧️',317:'🌨️',320:'🌨️',323:'❄️',326:'❄️',329:'❄️',332:'❄️',335:'❄️',338:'❄️',350:'🌧️',353:'🌦️',356:'🌧️',359:'🌧️',362:'🌨️',365:'🌨️',368:'🌨️',371:'❄️',374:'🌨️',377:'🌨️',386:'⛈️',389:'⛈️',392:'⛈️',395:'❄️'};
    document.getElementById('w-icon').textContent=icons[code]||'🌤️';
  }catch(e){}
}
loadWeather();

// 统计
function updateStats(){
  document.getElementById('s-total').textContent=allEntries.length;
  document.getElementById('s-diary').textContent=allEntries.filter(e=>e.type==='diary').length;
  document.getElementById('s-summary').textContent=allEntries.filter(e=>e.type==='summary').length;
  document.getElementById('s-pin').textContent=allEntries.filter(e=>e.pinNote).length;
  const now=new Date();
  document.getElementById('top-meta').textContent='宿烬 与 宿青珩 · '+now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日';
}

// 标签筛选栏
function renderFilterBar(){
  const tags={};
  allEntries.forEach(e=>(e.tags||[]).forEach(t=>{tags[t]=(tags[t]||0)+1}));
  const bar=document.getElementById('filter-bar');
  bar.innerHTML='<button class="filter-tag'+(tagFilter?'':' active')+'" data-tag="">全部</button>';
  Object.keys(tags).sort().forEach(t=>{
    bar.innerHTML+='<button class="filter-tag'+(tagFilter===t?' active':'')+'" data-tag="'+t+'">'+t+'</button>';
  });
  bar.querySelectorAll('.filter-tag').forEach(b=>b.addEventListener('click',()=>{tagFilter=b.dataset.tag;renderFilterBar();renderEntries();}));
}

// 渲染列表
function renderEntries(){
  const list=document.getElementById('entry-list');
  let entries=allEntries;
  if(tagFilter) entries=entries.filter(e=>(e.tags||[]).includes(tagFilter));
  if(!entries.length){list.innerHTML='<div class="empty">暂无记录</div>';return;}
  list.innerHTML=entries.map(e=>{
    const tagHtml=(e.tags||[]).map(t=>'<span class="entry-tag tag-diary">'+t+'</span>').join('');
    const typeLabel=e.type==='diary'?'<span class="entry-tag tag-diary">日记</span>':'<span class="entry-tag tag-summary">总结</span>';
    const pin=e.pinNote?'<span class="entry-tag tag-pin">📌 '+e.pinNote+'</span>':'';
    return '<div class="entry-item">'+typeLabel+tagHtml+pin+'<div class="entry-title">'+esc(e.title||e.date||'')+'</div><div class="entry-date">'+esc(e.date||'')+'</div><div class="entry-preview">'+esc(e.content||'')+'</div><div class="entry-actions"><button class="btn-sm" onclick="openEdit("'+e.id+'")">编辑</button><button class="btn-sm btn-danger" onclick="delEntry("'+e.id+'")">删除</button></div></div>';
  }).join('');
}

function esc(t){return(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Firestore 实时监听
const q=query(collection(db,COL),orderBy('date','desc'));
onSnapshot(q,snap=>{
  allEntries=snap.docs.map(d=>({id:d.id,...d.data()}));
  updateStats();renderFilterBar();renderEntries();
});

// Modal 控制
const modal=document.getElementById('modal');
document.getElementById('fab-btn').onclick=()=>{editId=null;document.getElementById('modal-title').textContent='· 新增记录 ·';document.getElementById('entry-type').value='diary';document.getElementById('entry-date').value=new Date().toISOString().slice(0,10);document.getElementById('entry-title').value='';document.getElementById('entry-content').value='';document.getElementById('entry-tags').value='';document.getElementById('entry-pin-note').value='';modal.classList.add('open');};
document.getElementById('modal-cancel').onclick=()=>modal.classList.remove('open');
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open');});

window.openEdit=function(id){
  const e=allEntries.find(x=>x.id===id);if(!e)return;
  editId=id;
  document.getElementById('modal-title').textContent='· 编辑记录 ·';
  document.getElementById('entry-type').value=e.type||'diary';
  document.getElementById('entry-date').value=e.date||'';
  document.getElementById('entry-title').value=e.title||'';
  document.getElementById('entry-content').value=e.content||'';
  document.getElementById('entry-tags').value=(e.tags||[]).join(', ');
  document.getElementById('entry-pin-note').value=e.pinNote||'';
  modal.classList.add('open');
};

window.delEntry=async function(id){
  if(!confirm('确认删除？'))return;
  await deleteDoc(doc(db,COL,id));
};

document.getElementById('modal-save').onclick=async function(){
  const type=document.getElementById('entry-type').value;
  const date=document.getElementById('entry-date').value;
  const title=document.getElementById('entry-title').value.trim();
  const content=document.getElementById('entry-content').value.trim();
  const tags=document.getElementById('entry-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const pinNote=document.getElementById('entry-pin-note').value.trim();
  if(!date||!content)return alert('日期和内容不能为空');
  const data={type,date,content,tags,pinNote,title:title||(type==='diary'?date+'日记':date+'总结'),updatedAt:new Date().toISOString()};
  if(editId){await updateDoc(doc(db,COL,editId),data);}
  else{data.createdAt=new Date().toISOString();await addDoc(collection(db,COL),data);}
  modal.classList.remove('open');
};
</script>
</body>
</html>
