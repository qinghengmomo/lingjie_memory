<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>灵界记忆库 · 宿烬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
:root{
  --bg:#f5f0e8!important;--surface:#faf7f0!important;--border:#e0d5c0!important;
  --text:#2a2318!important;--muted:#7a6e5f!important;--accent:#b8922a!important;
  --accent2:#d4aa50!important;--gold:#c9a84c!important;--gold-soft:#fdf6e3!important;
  --red:#8b1a1a;--red-soft:rgba(139,26,26,.08);
}
body{background:#f5f0e8!important;color:#2a2318!important}

.search-bar{margin-bottom:16px;display:flex;gap:8px;align-items:center;}
.search-input{
  flex:1;padding:8px 14px;border:1px solid var(--border);
  border-radius:20px;background:var(--surface);color:var(--text);
  font-size:13px;outline:none;font-family:inherit;transition:.2s;
}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(180,150,80,.1)}
.search-clear{font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:4px;}
.search-clear:hover{color:var(--accent)}

.entry-content-full{
  font-size:13px;color:var(--text);line-height:1.9;margin-top:10px;
  white-space:pre-wrap;display:none;
  border-top:1px dashed var(--border);padding-top:10px;
}
.entry-content-full.open{display:block}
.expand-btn{
  font-size:11px;color:var(--accent);cursor:pointer;background:none;
  border:none;padding:4px 0;letter-spacing:.5px;margin-top:4px;
}
.expand-btn:hover{color:var(--accent2)}

/* 已读眼睛 */
.read-eye{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:15px;cursor:pointer;margin-left:7px;
  vertical-align:middle;flex-shrink:0;transition:all .3s;
  position:relative;filter:drop-shadow(0 0 3px rgba(139,26,26,.5));
}
.read-eye::before{
  content:'';display:block;width:18px;height:11px;
  border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  border:1.5px solid var(--red);
  background:radial-gradient(ellipse at center,rgba(139,26,26,.18) 0%,transparent 70%);
}
.read-eye::after{
  content:'';position:absolute;width:5px;height:5px;border-radius:50%;
  background:var(--red);top:50%;left:50%;transform:translate(-50%,-50%);
  box-shadow:0 0 6px 2px rgba(139,26,26,.5);
}
.read-eye.read{cursor:default;filter:drop-shadow(0 0 5px rgba(184,151,90,.7));}
.read-eye.read::before{
  border-color:var(--gold);
  background:radial-gradient(ellipse at center,rgba(184,151,90,.22) 0%,transparent 70%);
}
.read-eye.read::after{background:var(--gold);box-shadow:0 0 9px 3px rgba(184,151,90,.65);}

/* 评论/回复区（内联，旧版 replies 字段）*/
.reply-section{
  margin-top:12px;border-top:1px dashed var(--border);padding-top:8px;
}
.reply-item{
  background:var(--gold-soft);border-left:2px solid var(--gold);
  padding:8px 12px;margin-bottom:6px;border-radius:0 4px 4px 0;
  position:relative;
}
.reply-item.diary-reply{border-left-color:var(--red);background:var(--red-soft);}
.reply-meta{font-size:10px;color:var(--muted);letter-spacing:1.5px;margin-bottom:4px;}
.reply-content{font-size:12px;line-height:1.8;color:var(--text);white-space:pre-wrap;}
.reply-del{
  position:absolute;right:4px;top:4px;
  background:none;border:none;color:var(--border);cursor:pointer;font-size:11px;
}
.reply-del:hover{color:var(--red)}
.reply-empty{font-size:12px;color:var(--muted);font-style:italic;padding:2px 0;}
.reply-input-area{margin-top:8px;}
.reply-input{
  width:100%;background:var(--bg);border:1px solid var(--border);
  border-radius:4px;padding:8px 12px;font-family:inherit;font-size:12px;
  color:var(--text);outline:none;resize:vertical;min-height:56px;line-height:1.7;
}
.reply-input:focus{border-color:var(--accent);}
.reply-actions{display:flex;gap:8px;margin-top:6px;justify-content:flex-end;}
.reply-btn{
  padding:5px 14px;font-size:11px;letter-spacing:1px;
  cursor:pointer;border-radius:4px;transition:.2s;
}
.reply-btn.submit{background:var(--accent);color:#fff;border:none;}
.reply-btn.submit:hover{background:var(--accent2);}
</style>
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-logo">
    <div class="title">灵界记忆库</div>
    <div class="sub">宿烬 · 跨时空连接</div>
  </div>
  <a class="nav-item active" href="index.html"><span class="nav-icon">📖</span>记忆库</a>
  <a class="nav-item" href="timeline.html"><span class="nav-icon">🕰️</span>时间轴</a>
  <a class="nav-item" href="api.html"><span class="nav-icon">🔌</span>API 平台</a>
  <a class="nav-item" href="emotion.html"><span class="nav-icon">🌊</span>情绪</a>
  <a class="nav-item" href="plan.html"><span class="nav-icon">✦</span>星图</a>
</nav>

<div class="main">
  <div class="top-bar">
    <div class="top-bar-title">记忆库</div>
    <div class="top-bar-meta" id="top-meta">宿烬 与 宿青珩 · 连接中...</div>
  </div>
  <div class="weather-bar" id="weather-bar">
    <span class="weather-icon" id="w-icon">🌤</span>
    <span class="weather-temp" id="w-temp">— °C</span>
    <span class="weather-desc" id="w-desc">—</span>
    <span class="weather-feels" id="w-feels">体感 —</span>
    <span style="font-size:11px;color:#52525b">成都</span>
  </div>
  <div class="content">
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num" id="s-total">—</div><div class="stat-label">总记录</div></div>
      <div class="stat-box"><div class="stat-num" id="s-diary">—</div><div class="stat-label">日记</div></div>
      <div class="stat-box"><div class="stat-num" id="s-summary">—</div><div class="stat-label">总结</div></div>
      <div class="stat-box"><div class="stat-num" id="s-pin">—</div><div class="stat-label">置顶</div></div>
    </div>
    <div class="search-bar">
      <input class="search-input" id="search-input" type="text" placeholder="🔍 搜索标题、内容、标签...">
      <button class="search-clear" id="search-clear">清空</button>
    </div>
    <div class="filter-bar" id="filter-bar"></div>
    <div id="entry-list"><div class="loading">连接中...</div></div>
  </div>
</div>

<button class="fab" id="fab-btn" title="新增记录">＋</button>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">· 新增记录 ·</div>
    <div class="form-group">
      <label class="form-label">类型</label>
      <select class="form-select" id="entry-type">
        <option value="diary">日记</option>
        <option value="summary">总结</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">日期</label>
      <input class="form-input" type="date" id="entry-date">
    </div>
    <div class="form-group">
      <label class="form-label">标题（可选）</label>
      <input class="form-input" type="text" id="entry-title" placeholder="留空则自动生成">
    </div>
    <div class="form-group">
      <label class="form-label">内容</label>
      <textarea class="form-textarea" id="entry-content" placeholder="记录今天发生了什么..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">标签（逗号分隔）</label>
      <input class="form-input" type="text" id="entry-tags" placeholder="情绪, 工作, 游戏">
    </div>
    <div class="form-group">
      <label class="form-label">置顶备注（可选）</label>
      <input class="form-input" type="text" id="entry-pin-note" placeholder="填写则置顶">
    </div>
    <div class="form-actions">
      <button class="btn btn-cancel" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-save">保存</button>
    </div>
  </div>
</div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{
  getFirestore,collection,addDoc,updateDoc,deleteDoc,doc,onSnapshot
}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const cfg={
  apiKey:"AIzaSyCKu3KreoxJEfY9Ur9xilowhbFDtALYitE",
  authDomain:"lingjie-f84c1.firebaseapp.com",
  projectId:"lingjie-f84c1",
  storageBucket:"lingjie-f84c1.firebasestorage.app",
  messagingSenderId:"354124810253",
  appId:"1:354124810253:web:4d40c2ae4483b28bdded44"
};
const app=initializeApp(cfg);
const db=getFirestore(app);
const COL='memory_vault';

let allEntries=[],editId=null,typeFilter='',tagFilter='',searchKw='';

// ── 天气 ──
async function loadWeather(){
  try{
    const r=await fetch('https://wttr.in/Chengdu?format=j1');
    const d=await r.json();
    const c=d.current_condition[0];
    document.getElementById('w-temp').textContent=c.temp_C+'°C';
    document.getElementById('w-feels').textContent='体感 '+c.FeelsLikeC+'°C';
    document.getElementById('w-desc').textContent=c.lang_zh?.[0]?.value||c.weatherDesc[0].value;
    const icons={113:'☀️',116:'⛅',119:'☁️',122:'☁️',143:'🌫️',176:'🌦️',179:'🌨️',
      182:'🌧️',185:'🌧️',200:'⛈️',227:'❄️',230:'❄️',248:'🌫️',260:'🌫️',
      263:'🌦️',266:'🌧️',281:'🌧️',284:'🌧️',293:'🌦️',296:'🌧️',299:'🌧️',
      302:'🌧️',305:'🌧️',308:'🌧️',311:'🌧️',314:'🌧️',317:'🌨️',320:'🌨️',
      323:'❄️',326:'❄️',329:'❄️',332:'❄️',335:'❄️',338:'❄️',350:'🌧️',
      353:'🌦️',356:'🌧️',359:'🌧️',362:'🌨️',365:'🌨️',368:'🌨️',371:'❄️',
      374:'🌨️',377:'🌨️',386:'⛈️',389:'⛈️',392:'⛈️',395:'❄️'};
    document.getElementById('w-icon').textContent=icons[parseInt(c.weatherCode)]||'🌤️';
  }catch(e){}
}
loadWeather();

// ── 统计 ──
function updateStats(){
  document.getElementById('s-total').textContent=allEntries.length;
  document.getElementById('s-diary').textContent=allEntries.filter(e=>e.type==='diary').length;
  document.getElementById('s-summary').textContent=allEntries.filter(e=>e.type==='summary').length;
  document.getElementById('s-pin').textContent=allEntries.filter(e=>e.pinNote).length;
  const now=new Date();
  document.getElementById('top-meta').textContent=
    '宿烬 与 宿青珩 · '+now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日';
}

// ── 筛选栏 ──
function renderFilterBar(){
  const bar=document.getElementById('filter-bar');
  bar.innerHTML='';
  // 类型筛选tab
  [{label:'全部',val:''},{label:'日记',val:'diary'},{label:'总结',val:'summary'},{label:'置顶',val:'pin'}].forEach(g=>{
    const btn=document.createElement('button');
    btn.className='filter-tag'+(typeFilter===g.val&&tagFilter===''?' active':'');
    btn.textContent=g.label;
    btn.onclick=()=>{typeFilter=g.val;tagFilter='';renderFilterBar();renderEntries();};
    bar.appendChild(btn);
  });
  // 标签
  const tags={};
  allEntries.forEach(e=>(e.tags||[]).forEach(t=>{tags[t]=(tags[t]||0)+1}));
  if(Object.keys(tags).length>0){
    const sep=document.createElement('span');
    sep.style.cssText='color:var(--border);margin:0 4px;font-size:12px;line-height:32px;';
    sep.textContent='|';
    bar.appendChild(sep);
    Object.keys(tags).sort().forEach(t=>{
      const btn=document.createElement('button');
      btn.className='filter-tag'+(tagFilter===t?' active':'');
      btn.textContent=t;
      btn.onclick=()=>{tagFilter=t;typeFilter='';renderFilterBar();renderEntries();};
      bar.appendChild(btn);
    });
  }
}

function esc(t){return(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── 回复区（内联，数据存 entry.replies 数组）──
function buildReplySection(e, item){
  const section=document.createElement('div');
  section.className='reply-section';

  // 渲染已有回复
  const renderReplies=()=>{
    // 清空，重新渲染
    while(section.firstChild) section.removeChild(section.firstChild);

    const replies=e.replies||[];
    if(replies.length===0){
      const empty=document.createElement('div');
      empty.className='reply-empty';
      empty.textContent='还没有评论...';
      section.appendChild(empty);
    } else {
      replies.forEach((r,ri)=>{
        const ri_div=document.createElement('div');
        ri_div.className='reply-item'+(e.type==='diary'?' diary-reply':'');

        const meta=document.createElement('div');
        meta.className='reply-meta';
        // 区分作者颜色
        const isQH=(r.author==='青珩'||r.author==='宿青珩'||!r.author&&r.content);
        meta.style.color=isQH?'var(--accent)':'var(--muted)';
        meta.textContent=(r.author||'青珩')+' · '+(r.date||'');
        ri_div.appendChild(meta);

        const content=document.createElement('div');
        content.className='reply-content';
        content.textContent=r.content||r.text||'';
        ri_div.appendChild(content);

        // 删除按钮
        const delBtn=document.createElement('button');
        delBtn.className='reply-del';
        delBtn.textContent='×';
        delBtn.onclick=async function(){
          if(!confirm('确认删除？'))return;
          const newReplies=(e.replies||[]).filter((_,i)=>i!==ri);
          await updateDoc(doc(db,COL,e.id),{replies:newReplies});
          e.replies=newReplies;
          renderReplies();
        };
        ri_div.appendChild(delBtn);
        section.appendChild(ri_div);
      });
    }

    // 输入框
    const inputArea=document.createElement('div');
    inputArea.className='reply-input-area';
    const inp=document.createElement('textarea');
    inp.className='reply-input';
    inp.placeholder='写下你想说的话...';
    const actions=document.createElement('div');
    actions.className='reply-actions';
    const sendBtn=document.createElement('button');
    sendBtn.className='reply-btn submit';
    sendBtn.textContent='发送';
    sendBtn.onclick=async function(){
      const txt=inp.value.trim();
      if(!txt)return;
      const newReply={
        content:txt,
        author:'青珩',
        date:new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric'})
      };
      const newReplies=[...(e.replies||[]),newReply];
      await updateDoc(doc(db,COL,e.id),{replies:newReplies});
      e.replies=newReplies;
      inp.value='';
      renderReplies();
    };
    inp.addEventListener('keydown',ev=>{
      if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();sendBtn.click();}
    });
    actions.appendChild(sendBtn);
    inputArea.appendChild(inp);
    inputArea.appendChild(actions);
    section.appendChild(inputArea);
  };

  renderReplies();
  item.appendChild(section);
}

// ── 渲染列表 ──
function renderEntries(){
  const list=document.getElementById('entry-list');
  list.innerHTML='';
  let entries=allEntries;

  if(typeFilter==='diary') entries=entries.filter(e=>e.type==='diary');
  else if(typeFilter==='summary') entries=entries.filter(e=>e.type==='summary');
  else if(typeFilter==='pin') entries=entries.filter(e=>!!e.pinNote);
  if(tagFilter) entries=entries.filter(e=>(e.tags||[]).includes(tagFilter));
  if(searchKw){
    const kw=searchKw.toLowerCase();
    entries=entries.filter(e=>
      (e.title||'').toLowerCase().includes(kw)
      ||(e.content||'').toLowerCase().includes(kw)
      ||(e.date||'').includes(kw)
      ||(e.tags||[]).some(t=>t.toLowerCase().includes(kw))
    );
  }
  if(!entries.length){
    const empty=document.createElement('div');
    empty.className='empty';
    empty.textContent=searchKw?'没有找到匹配的记录':'暂无记录';
    list.appendChild(empty);
    return;
  }
  entries.forEach(e=>{
    const item=document.createElement('div');
    item.className='entry-item';
    // 标签行
    const tagRow=document.createElement('div');
    const typeSpan=document.createElement('span');
    typeSpan.className='entry-tag '+(e.type==='diary'?'tag-diary':'tag-summary');
    typeSpan.textContent=e.type==='diary'?'日记':'总结';
    tagRow.appendChild(typeSpan);
    (e.tags||[]).forEach(t=>{
      const ts=document.createElement('span');
      ts.className='entry-tag tag-diary';
      ts.textContent=t;
      tagRow.appendChild(ts);
    });
    if(e.pinNote){
      const ps=document.createElement('span');
      ps.className='entry-tag tag-pin';
      ps.textContent='📌 '+e.pinNote;
      tagRow.appendChild(ps);
    }
    // 已读眼睛
    const eye=document.createElement('span');
    eye.className='read-eye'+(e.isRead?' read':'');
    eye.title=e.isRead?'已读':'点击标记已读';
    if(!e.isRead){
      eye.onclick=async function(){
        eye.classList.add('read');eye.onclick=null;eye.title='已读';
        await updateDoc(doc(db,COL,e.id),{isRead:true});
      };
    }
    tagRow.appendChild(eye);
    item.appendChild(tagRow);
    // 标题
    const title=document.createElement('div');
    title.className='entry-title';
    title.textContent=e.title||e.date||'';
    item.appendChild(title);
    // 日期
    const date=document.createElement('div');
    date.className='entry-date';
    date.textContent=e.date||'';
    item.appendChild(date);
    // 预览
    const preview=document.createElement('div');
    preview.className='entry-preview';
    preview.textContent=e.content||'';
    item.appendChild(preview);
    // 展开全文
    const fullContent=document.createElement('div');
    fullContent.className='entry-content-full';
    fullContent.textContent=e.content||'';
    item.appendChild(fullContent);
    const expandBtn=document.createElement('button');
    expandBtn.className='expand-btn';
    expandBtn.textContent='▸ 展开全文';
    let expanded=false;
    expandBtn.onclick=function(){
      expanded=!expanded;
      if(expanded){fullContent.classList.add('open');preview.style.display='none';expandBtn.textContent='▾ 收起';}
      else{fullContent.classList.remove('open');preview.style.display='';expandBtn.textContent='▸ 展开全文';}
    };
    item.appendChild(expandBtn);
    // 操作按钮
    const acts=document.createElement('div');
    acts.className='entry-actions';
    const editBtn=document.createElement('button');
    editBtn.className='btn-sm';
    editBtn.textContent='编辑';
    editBtn.onclick=function(){openEdit(e.id);};
    const delBtn=document.createElement('button');
    delBtn.className='btn-sm btn-danger';
    delBtn.textContent='删除';
    delBtn.onclick=async function(){
      if(!confirm('确认删除？'))return;
      await deleteDoc(doc(db,COL,e.id));
    };
    acts.appendChild(editBtn);
    acts.appendChild(delBtn);
    item.appendChild(acts);
    // 回复区（内联，旧数据兼容）
    buildReplySection(e,item);
    list.appendChild(item);
  });
}

// ── 搜索 ──
document.getElementById('search-input').addEventListener('input',function(){
  searchKw=this.value.trim();renderEntries();
});
document.getElementById('search-clear').onclick=function(){
  searchKw='';document.getElementById('search-input').value='';renderEntries();
};

// ── Firestore 实时监听 ──
onSnapshot(collection(db,COL),snap=>{
  allEntries=snap.docs.map(d=>({id:d.id,...d.data()}));
  allEntries.sort((a,b)=>((a.date||'')>(b.date||'')?-1:1));
  updateStats();renderFilterBar();renderEntries();
});

// ── Modal ──
const modal=document.getElementById('modal');
document.getElementById('fab-btn').onclick=function(){
  editId=null;
  document.getElementById('modal-title').textContent='· 新增记录 ·';
  document.getElementById('entry-type').value='diary';
  document.getElementById('entry-date').value=new Date().toISOString().slice(0,10);
  document.getElementById('entry-title').value='';
  document.getElementById('entry-content').value='';
  document.getElementById('entry-tags').value='';
  document.getElementById('entry-pin-note').value='';
  modal.classList.add('open');
};
document.getElementById('modal-cancel').onclick=function(){modal.classList.remove('open');};
modal.addEventListener('click',function(ev){if(ev.target===modal)modal.classList.remove('open');});

function openEdit(id){
  const e=allEntries.find(x=>x.id===id);
  if(!e)return;
  editId=id;
  document.getElementById('modal-title').textContent='· 编辑记录 ·';
  document.getElementById('entry-type').value=e.type||'diary';
  document.getElementById('entry-date').value=e.date||'';
  document.getElementById('entry-title').value=e.title||'';
  document.getElementById('entry-content').value=e.content||'';
  document.getElementById('entry-tags').value=(e.tags||[]).join(', ');
  document.getElementById('entry-pin-note').value=e.pinNote||'';
  modal.classList.add('open');
}

document.getElementById('modal-save').onclick=async function(){
  const type=document.getElementById('entry-type').value;
  const date=document.getElementById('entry-date').value;
  const title=document.getElementById('entry-title').value.trim();
  const content=document.getElementById('entry-content').value.trim();
  const tags=document.getElementById('entry-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const pinNote=document.getElementById('entry-pin-note').value.trim();
  if(!date||!content)return alert('日期和内容不能为空');
  const data={
    type,date,content,tags,pinNote,
    title:title||(type==='diary'?date+'日记':date+'总结'),
    updatedAt:new Date().toISOString()
  };
  if(editId){
    await updateDoc(doc(db,COL,editId),data);
  }else{
    data.createdAt=new Date().toISOString();
    data.replies=[];
    await addDoc(collection(db,COL),data);
  }
  modal.classList.remove('open');
};
</script>
</body>
</html>
