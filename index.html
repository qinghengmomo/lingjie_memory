<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>灵界记忆库 · 宿烬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/galaxy.css">
<link rel="stylesheet" href="styles/plan.css">
<link rel="stylesheet" href="styles/gifts.css">
<style>
/* ══ SPA 完整样式 ══ */
:root{
  --ink:#1a1118;--paper:#f5f0eb;--paper2:#ede6dc;
  --red:#8b1a1a;--red-soft:#c0392b18;
  --gold:#b8975a;--gold-soft:#b8975a15;
  --mist:#8a7f8d;--border:#c8bfb044;--shadow:#1a111822;
  --reply-bg:#ede8e0;--pin:#c0392b;
  --api-accent:#4a6fa5;--api-soft:#4a6fa512;
  --green:#2e7d50;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans SC',sans-serif;min-height:100vh;overflow-x:hidden;display:block!important;}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(ellipse at 20% 10%,#e8ddd088 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,#d4c9be55 0%,transparent 50%);pointer-events:none;z-index:0;}

.nav-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--paper);z-index:50;padding:8px 16px 8px 0;}
.nav-tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;flex:1;min-width:0;}
.nav-tab{padding:10px 14px;font-size:11px;letter-spacing:2px;color:var(--mist);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;font-family:'Noto Sans SC',sans-serif;background:none;border-top:none;border-left:none;border-right:none;white-space:nowrap;text-decoration:none;display:inline-block;}
.nav-tab:hover{color:var(--ink);}
.nav-tab.active{color:var(--ink);border-bottom-color:var(--gold);font-weight:600;}
.nav-tab[data-page="api"].active{border-bottom-color:var(--api-accent);color:var(--api-accent);}
.nav-tab[data-page="galaxy"].active{border-bottom-color:#e8845f;color:#e8845f;}
.nav-tab[data-page="gifts"].active{border-bottom-color:#c4928f;color:#c4928f;}

.auth-area{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:8px;}
.auth-status{font-size:10px;color:var(--mist);letter-spacing:1px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.auth-btn{padding:4px 10px;font-size:10px;letter-spacing:1px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--mist);font-family:'Noto Sans SC',sans-serif;transition:all .2s;white-space:nowrap;}
.auth-btn:hover{border-color:var(--ink);color:var(--ink);}

.auth-toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:var(--paper);padding:10px 24px;font-size:12px;letter-spacing:2px;opacity:0;pointer-events:none;transition:all .3s;z-index:999;}
.auth-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.page{display:none;max-width:1100px;margin:0 auto;padding:0 24px 80px;position:relative;z-index:1;}
.page.active{display:block;}
.page#page-gifts{max-width:none;padding:0;}

/* 记忆库 */
.vault-header{text-align:center;margin-bottom:36px;padding-top:40px;position:relative;}
.vault-header::before{content:'烬';position:absolute;top:10px;left:50%;transform:translateX(-50%);font-family:'Noto Serif SC',serif;font-size:120px;color:var(--red);opacity:0.04;pointer-events:none;}
.vault-title{font-family:'Noto Serif SC',serif;font-size:12px;font-weight:300;letter-spacing:6px;color:var(--mist);margin-bottom:12px;}
.vault-name{font-family:'Noto Serif SC',serif;font-size:30px;font-weight:600;color:var(--ink);letter-spacing:8px;margin-bottom:14px;}
.vault-divider{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px;}
.vault-divider::before{background:linear-gradient(90deg,transparent,var(--gold));}
.vault-divider::after{background:linear-gradient(90deg,var(--gold),transparent);}
.vault-divider::before,.vault-divider::after{content:'';width:60px;height:1px;}
.vault-divider-dot{width:4px;height:4px;border-radius:50%;background:var(--gold);}
.vault-subtitle{font-size:11px;color:var(--mist);letter-spacing:3px;}

.sync-status{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:24px;font-size:11px;color:var(--mist);letter-spacing:2px;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#ccc;transition:background .3s;}
.sync-dot.connected{background:#7cb87c;}
.sync-dot.syncing{background:var(--gold);animation:pulse 1s infinite;}
.sync-dot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.stats-panel{display:flex;border:1px solid var(--border);margin-bottom:24px;background:var(--gold-soft);}
.stat-cell{flex:1;text-align:center;padding:12px 0;cursor:pointer;border-right:1px solid var(--border);transition:.2s;}
.stat-cell:last-child{border-right:none;}
.stat-cell:hover{background:rgba(184,151,90,.1);}
.stat-cell.active{background:var(--ink);}
.stat-cell.active .lbl{color:var(--paper2);opacity:.7;}
.stat-cell.active .num{color:var(--paper);}
.num{font-family:'Cinzel',serif;font-size:20px;color:var(--ink);display:block;}
.lbl{font-size:10px;letter-spacing:2px;color:var(--mist);}

.weather-bar{display:flex;align-items:center;gap:10px;margin-bottom:20px;font-size:12px;color:var(--mist);padding:6px 12px;border:1px solid var(--border);background:var(--paper2);letter-spacing:1px;}

.search-bar{display:flex;align-items:center;margin-bottom:16px;border:1px solid var(--border);background:var(--paper2);}
.search-input{flex:1;border:none;background:transparent;padding:10px 14px;font-family:'Noto Sans SC',sans-serif;font-size:13px;color:var(--ink);outline:none;}
.search-input::placeholder{color:var(--mist);}
.search-clear{padding:10px 12px;color:var(--mist);cursor:pointer;font-size:12px;border:none;background:none;display:none;}
.search-clear.show{display:block;}

.filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.filter-btn{padding:6px 16px;border:1px solid var(--border);background:transparent;color:var(--mist);font-family:'Noto Sans SC',sans-serif;font-size:11px;letter-spacing:2px;cursor:pointer;transition:all .25s;}
.filter-btn:hover,.filter-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.filter-btn.diary.active{background:var(--red);border-color:var(--red);color:white;}
.filter-btn.summary.active{background:var(--gold);border-color:var(--gold);color:white;}
.filter-btn.pinned.active{background:var(--pin);border-color:var(--pin);color:white;}
.tag-chip{padding:3px 10px;border-radius:20px;font-size:10px;letter-spacing:1px;cursor:pointer;border:1px solid var(--border);color:var(--mist);background:transparent;font-family:'Noto Sans SC',sans-serif;transition:all .2s;}
.tag-chip:hover,.tag-chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

.entry{border-left:1px solid var(--border);position:relative;padding:0 0 36px 32px;animation:fadeIn .4s ease forwards;opacity:0;}
.entry:last-child{padding-bottom:0;}
.entry.pinned-entry{border-left-color:var(--pin);}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.entry::before{content:'';position:absolute;left:-5px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--gold);}
.entry.diary::before{border-color:var(--red);}
.entry.pinned-entry::before{border-color:var(--pin);}

.entry-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.entry-date{font-family:'Cinzel',serif;font-size:11px;color:var(--mist);letter-spacing:1px;}
.entry-tag-label{font-size:10px;letter-spacing:2px;padding:2px 8px;}
.entry-tag-label.diary{color:var(--red);border:1px solid var(--red);background:var(--red-soft);}
.entry-tag-label.summary{color:var(--gold);border:1px solid var(--gold);background:var(--gold-soft);}
.pin-badge{font-size:10px;color:var(--pin);letter-spacing:1px;}
.custom-tag{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--gold-soft);border:1px solid var(--gold);color:var(--gold);letter-spacing:1px;}

.entry-title{font-family:'Noto Serif SC',serif;font-size:17px;font-weight:600;color:var(--ink);margin-bottom:10px;line-height:1.4;}
.entry-preview{font-size:14px;color:#3a2f38;line-height:1.8;white-space:pre-wrap;font-family:'Noto Serif SC',serif;font-weight:300;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
.entry-content-full{margin-top:8px;font-size:14px;color:#3a2f38;line-height:2;white-space:pre-wrap;font-family:'Noto Serif SC',serif;font-weight:300;display:none;}
.entry-content-full.open{display:block;}
.expand-btn{background:none;border:none;color:var(--mist);font-size:11px;cursor:pointer;padding:2px 6px;letter-spacing:1px;margin-top:8px;}
.expand-btn:hover{color:var(--gold);}

.entry-actions{display:flex;gap:4px;justify-content:flex-end;margin-bottom:6px;}
.action-btn{background:none;border:none;color:var(--mist);cursor:pointer;font-size:11px;padding:4px 7px;transition:color .2s;font-family:'Noto Sans SC',sans-serif;letter-spacing:1px;}
.action-btn:hover{color:var(--ink);}
.action-btn.del:hover{color:var(--red);}
.action-btn.pin-btn{font-size:13px;}
.action-btn.pin-btn.pinned{color:var(--pin);}

.read-eye{display:inline-flex;align-items:center;justify-content:center;width:20px;height:14px;cursor:pointer;margin-left:6px;vertical-align:middle;flex-shrink:0;transition:all .3s;position:relative;filter:drop-shadow(0 0 3px #8b1a1a88);}
.read-eye::before{content:'';display:block;width:16px;height:10px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:1.5px solid var(--red);background:radial-gradient(ellipse at center, #8b1a1a22 0%, transparent 70%);}
.read-eye::after{content:'';position:absolute;width:5px;height:5px;border-radius:50%;background:var(--red);top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px 2px #8b1a1a66;}
.read-eye.read{filter:drop-shadow(0 0 4px #b8975a99);}
.read-eye.read::before{border-color:var(--gold);background:radial-gradient(ellipse at center, #b8975a22 0%, transparent 70%);}
.read-eye.read::after{background:var(--gold);box-shadow:0 0 8px 3px #b8975a88;}

.reply-section{margin-top:12px;}
.reply-item{padding:8px 12px;background:var(--reply-bg);margin-bottom:6px;border-left:2px solid var(--gold);font-size:13px;position:relative;}
.diary-reply{border-left-color:var(--red);}
.reply-meta{font-size:11px;color:var(--mist);letter-spacing:1px;margin-bottom:4px;}
.reply-content{color:var(--ink);line-height:1.8;}
.reply-del{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--mist);cursor:pointer;font-size:14px;}
.reply-del:hover{color:var(--red);}
.reply-input-area{margin-top:8px;}
.reply-input{width:100%;padding:8px;border:1px solid var(--border);background:var(--paper2);font-family:'Noto Serif SC',serif;font-size:13px;color:var(--ink);resize:none;min-height:60px;outline:none;}
.reply-input:focus{border-color:var(--gold);}
.reply-actions{display:flex;gap:8px;margin-top:6px;justify-content:flex-end;}
.reply-btn{padding:4px 12px;font-size:11px;letter-spacing:1px;cursor:pointer;border:1px solid var(--border);font-family:'Noto Sans SC',sans-serif;}
.reply-btn.submit{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.reply-btn.cancel{background:transparent;color:var(--mist);}
.reply-empty{font-size:12px;color:var(--mist);padding:4px 0;letter-spacing:1px;}

/* API */
.api-header{margin-bottom:28px;padding-top:40px;}
.api-title{font-family:'Noto Serif SC',serif;font-size:26px;font-weight:600;color:var(--ink);letter-spacing:6px;margin-bottom:8px;}
.page-divider{display:flex;align-items:center;gap:12px;margin:14px 0;}
.page-divider::before{background:linear-gradient(90deg,transparent,var(--api-accent));}
.page-divider::after{background:linear-gradient(90deg,var(--api-accent),transparent);}
.page-divider::before,.page-divider::after{content:'';width:40px;height:1px;}
.page-divider-dot{width:4px;height:4px;border-radius:50%;background:var(--api-accent);}
.api-subtitle{font-size:11px;color:var(--mist);letter-spacing:3px;}
.api-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-bottom:32px;}
.api-card{background:var(--paper2);border:1px solid var(--border);padding:22px;position:relative;transition:border-color .2s,transform .15s;animation:fadeIn .4s ease forwards;opacity:0;}
.api-card:hover{border-color:var(--api-accent);transform:translateY(-2px);}
.api-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
.api-card-name{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:600;color:var(--ink);line-height:1.4;}
.api-card-actions{display:flex;gap:4px;flex-shrink:0;margin-left:8px;}
.api-action-btn{background:none;border:none;color:var(--mist);cursor:pointer;font-size:11px;padding:3px 7px;transition:color .2s;font-family:'Noto Sans SC',sans-serif;letter-spacing:1px;}
.api-action-btn:hover{color:var(--ink);}
.api-action-btn.del:hover{color:var(--red);}
.api-card-url{font-size:12px;color:var(--api-accent);margin-bottom:12px;word-break:break-all;text-decoration:none;display:block;font-family:'Noto Sans SC',monospace;background:var(--api-soft);padding:6px 10px;border-left:2px solid var(--api-accent);}
.api-card-url:hover{text-decoration:underline;}
.api-card-row{display:flex;justify-content:space-between;align-items:flex-start;font-size:12px;color:var(--mist);margin-bottom:7px;gap:8px;}
.api-card-row:last-child{margin-bottom:0;}
.api-card-label{letter-spacing:1px;white-space:nowrap;flex-shrink:0;}
.api-card-value{color:var(--ink);font-family:'Noto Sans SC',sans-serif;text-align:right;word-break:break-word;}
.api-card-note{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--mist);line-height:1.9;white-space:pre-wrap;}
.api-modal{border-top-color:var(--api-accent)!important;}

/* 公共 */
.fab-btn{position:fixed;bottom:32px;right:32px;width:52px;height:52px;background:var(--ink);color:var(--paper);border:none;border-radius:50%;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px var(--shadow);transition:all .2s;z-index:100;}
.fab-btn:hover{transform:scale(1.08);}
.modal-overlay{position:fixed;inset:0;background:#1a111888;backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:24px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--paper);width:100%;max-width:560px;padding:36px;border-top:2px solid var(--gold);box-shadow:0 20px 60px var(--shadow);animation:slideUp .3s ease;max-height:90vh;overflow-y:auto;}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{font-family:'Noto Serif SC',serif;font-size:16px;letter-spacing:4px;color:var(--ink);margin-bottom:24px;}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:11px;letter-spacing:3px;color:var(--mist);margin-bottom:7px;}
.form-input,.form-select,.form-textarea{width:100%;background:var(--paper2);border:1px solid var(--border);padding:10px 14px;font-family:'Noto Sans SC',sans-serif;font-size:13px;color:var(--ink);outline:none;transition:border-color .2s;border-radius:0;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--gold);}
.form-textarea{min-height:100px;resize:vertical;line-height:1.8;font-family:'Noto Serif SC',serif;}
.form-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px;}
.btn-cancel{padding:10px 20px;border:1px solid var(--border);background:transparent;color:var(--mist);font-size:12px;letter-spacing:2px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:all .2s;}
.btn-cancel:hover{border-color:var(--ink);color:var(--ink);}
.btn-save{padding:10px 24px;background:var(--ink);border:none;color:var(--paper);font-size:12px;letter-spacing:2px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:all .2s;}
.btn-save:hover{background:var(--red);}

.empty-state{text-align:center;padding:60px 0;color:var(--mist);}
.empty-icon{font-size:36px;margin-bottom:16px;opacity:.3;}
.empty-text{font-size:13px;letter-spacing:3px;font-family:'Noto Serif SC',serif;line-height:2.2;}

@media(max-width:900px){
  .page{padding:0 16px 80px;}
  .page#page-gifts{padding:0;}
  #page-memory [id="m-dual-col"]{grid-template-columns:1fr!important;}
  .api-grid{grid-template-columns:1fr;}
  .nav-tab{padding:10px 10px;font-size:10px;letter-spacing:1px;}
}
.login-modal-overlay{position:fixed;inset:0;background:rgba(26,17,24,0.55);backdrop-filter:blur(6px);z-index:9000;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .3s ease;}
.login-modal-overlay.open{display:flex;opacity:1;}
.login-modal{background:var(--paper);border:1px solid var(--border);padding:40px 36px 32px;width:320px;max-width:90vw;position:relative;animation:modalIn .35s ease;}
@keyframes modalIn{from{opacity:0;transform:translateY(-16px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.login-modal-title{font-family:'Noto Serif SC',serif;font-size:18px;font-weight:600;color:var(--ink);letter-spacing:4px;text-align:center;margin-bottom:6px;}
.login-modal-sub{font-size:11px;color:var(--mist);letter-spacing:2px;text-align:center;margin-bottom:28px;}
.login-modal-input{width:100%;padding:12px 14px;border:1px solid var(--border);background:var(--paper2);font-family:'Noto Sans SC',sans-serif;font-size:14px;color:var(--ink);outline:none;letter-spacing:1px;transition:border-color .2s;}
.login-modal-input:focus{border-color:var(--gold);}
.login-modal-input::placeholder{color:var(--mist);font-size:12px;letter-spacing:2px;}
.login-modal-error{font-size:11px;color:var(--red);letter-spacing:1px;margin-top:8px;min-height:16px;text-align:center;}
.login-modal-actions{display:flex;gap:10px;margin-top:20px;}
.login-modal-btn{flex:1;padding:10px 0;font-size:12px;letter-spacing:2px;cursor:pointer;border:1px solid var(--border);font-family:'Noto Sans SC',sans-serif;transition:all .2s;text-align:center;}
.login-modal-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.login-modal-btn.primary:hover{background:#2a2028;}
.login-modal-btn.secondary{background:transparent;color:var(--mist);}
.login-modal-btn.secondary:hover{border-color:var(--ink);color:var(--ink);}
.login-modal-btn:disabled{opacity:0.5;cursor:not-allowed;}
.login-modal-close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:18px;color:var(--mist);cursor:pointer;line-height:1;}
.login-modal-close:hover{color:var(--ink);}

</style>
</head>
<body>

<div class="nav-header">
  <div class="nav-tabs">
    <a class="nav-tab active" href="#memory" data-page="memory">记忆库</a>
    <a class="nav-tab" href="#api" data-page="api">API平台</a>
    <a class="nav-tab" href="#galaxy" data-page="galaxy">星河</a>
    <a class="nav-tab" href="#plan" data-page="plan">星图</a>
    <a class="nav-tab" href="#gifts" data-page="gifts">花房</a>
  </div>
  <div class="auth-area">
    <span class="auth-status" id="auth-status">未登录</span>
    <button class="auth-btn" id="auth-btn">登录</button>
  </div>
</div>

<div class="auth-toast" id="auth-toast">请先登录后再操作</div>

<div class="page active" id="page-memory"></div>
<div class="page" id="page-api"></div>
<div class="page" id="page-galaxy"></div>
<div class="page" id="page-plan"></div>
<div class="page" id="page-gifts"></div>

<script type="module" src="app.js"></script>
<div class="login-modal-overlay" id="login-modal">
  <div class="login-modal">
    <button class="login-modal-close" id="login-modal-close">&times;</button>
    <div class="login-modal-title">灵 界</div>
    <div class="login-modal-sub">请输入验证密码</div>
    <input type="password" class="login-modal-input" id="login-pwd" placeholder="密码" autocomplete="current-password">
    <div class="login-modal-error" id="login-error"></div>
    <div class="login-modal-actions">
      <button class="login-modal-btn secondary" id="login-cancel">取消</button>
      <button class="login-modal-btn primary" id="login-submit">连接</button>
    </div>
  </div>
</div>

</body>
</html>
